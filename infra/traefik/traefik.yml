## Traefik v3 — WorkMesh AI Local Development Config

# ─── Global ───────────────────────────────────────────────────────────────────
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ─── API & Dashboard ──────────────────────────────────────────────────────────
api:
  dashboard: true
  insecure: true         # Dashboard on port 8090 without auth (dev only)

# ─── Entry Points ─────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8090"

# ─── Providers ────────────────────────────────────────────────────────────────
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: workmesh-ai_workmesh
  file:
    directory: /etc/traefik/dynamic
    watch: true

# ─── Logging ──────────────────────────────────────────────────────────────────
log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Authorization: drop

# ─── Metrics ──────────────────────────────────────────────────────────────────
metrics:
  prometheus:
    addRoutersLabels: true
    addServicesLabels: true
