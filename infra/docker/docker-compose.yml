name: remote-ai-platform

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  remote_ai_platform:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:
  keycloak_data:

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────────────────────────────────────

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: remote-ai-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_ai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-remote_ai_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remote_ai_platform_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - remote_ai_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remote_ai_platform} -d ${POSTGRES_DB:-remote_ai_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: remote-ai-platform-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - remote_ai_platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (Object Storage) ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: remote-ai-platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_dev_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks:
      - remote_ai_platform
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket init
  minio-init:
    image: minio/mc:latest
    container_name: remote-ai-platform-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin_dev_password};
        mc mb --ignore-existing local/remote-ai-platform-resumes;
        mc mb --ignore-existing local/remote-ai-platform-assets;
        mc policy set download local/remote-ai-platform-assets;
        echo 'MinIO buckets initialized';
      "
    networks:
      - remote_ai_platform

  # ─── Keycloak (Authentication) ────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: remote-ai-platform-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-remote_ai_platform}
      KC_DB_USERNAME: ${POSTGRES_USER:-remote_ai_platform}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-remote_ai_platform_dev_password}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/realm-remote-ai-platform.json:/opt/keycloak/data/import/realm-remote-ai-platform.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - remote_ai_platform
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ─────────────────────────────────────────────────────────────────────────────
  # APPLICATION SERVICES
  # ─────────────────────────────────────────────────────────────────────────────

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: development
    container_name: remote-ai-platform-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-remote_ai_platform}:${POSTGRES_PASSWORD:-remote_ai_platform_dev_password}@postgres:5432/${POSTGRES_DB:-remote_ai_platform}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_dev_password}
      MINIO_SECURE: "false"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-remote-ai-platform}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-remote-ai-platform-api}
      KEYCLOAK_WEB_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-remote-ai-platform-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_prod}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-qwen2.5}
      AI_API_KEY: ${AI_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      AI_FALLBACK_PROVIDERS: ${AI_FALLBACK_PROVIDERS:-ollama/qwen2.5}
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ../../apps/api:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - remote_ai_platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: remote-ai-platform-web
    restart: unless-stopped
    # Production image — no bind mount so the built .next output is used.
    # The Dockerfile CMD starts `next start` on port 3000.
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - remote_ai_platform

  celery-worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: development
    container_name: remote-ai-platform-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,jobs,ai,matching
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-remote_ai_platform}:${POSTGRES_PASSWORD:-remote_ai_platform_dev_password}@postgres:5432/${POSTGRES_DB:-remote_ai_platform}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_dev_password}
      MINIO_SECURE: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-qwen2.5}
      AI_API_KEY: ${AI_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      AI_FALLBACK_PROVIDERS: ${AI_FALLBACK_PROVIDERS:-ollama/qwen2.5}
    volumes:
      - ../../apps/api:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - remote_ai_platform
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-beat:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: development
    container_name: remote-ai-platform-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-remote_ai_platform}:${POSTGRES_PASSWORD:-remote_ai_platform_dev_password}@postgres:5432/${POSTGRES_DB:-remote_ai_platform}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ../../apps/api:/app
    depends_on:
      - redis
    networks:
      - remote_ai_platform
