name: remote-ai-platform

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  remote_ai_platform:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────────────────────────────────────

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: remote-ai-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_ai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-remote_ai_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remote_ai_platform_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - remote_ai_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remote_ai_platform} -d ${POSTGRES_DB:-remote_ai_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: remote-ai-platform-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - remote_ai_platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (Object Storage) ───────────────────────────────────────────────────
  # MinIO stopped publishing images to Docker Hub/Quay in 2026; pgsty/* are the
  # Pigsty-maintained builds of the same upstream binaries (drop-in: same
  # entrypoint, same env vars, curl present for the healthcheck). Pinned.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: remote-ai-platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_dev_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    networks:
      - remote_ai_platform
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket init (one-shot)
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: remote-ai-platform-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin_dev_password};
        mc mb --ignore-existing local/remote-ai-platform-resumes;
        mc mb --ignore-existing local/remote-ai-platform-assets;
        mc anonymous set download local/remote-ai-platform-assets;
        echo 'MinIO buckets initialized';
      "
    networks:
      - remote_ai_platform

  # ─────────────────────────────────────────────────────────────────────────────
  # APPLICATION SERVICES
  # ─────────────────────────────────────────────────────────────────────────────

  # ─── API (FastAPI) ────────────────────────────────────────────────────────────
  # Production image target: runs `alembic upgrade head` automatically via
  # start-production.sh, then starts uvicorn. No bind mount so the image is
  # self-contained and fresh-clone deterministic.
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: production
    container_name: remote-ai-platform-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-remote_ai_platform}:${POSTGRES_PASSWORD:-remote_ai_platform_dev_password}@postgres:5432/${POSTGRES_DB:-remote_ai_platform}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_dev_password}
      MINIO_SECURE: "false"
      # Free-tier AI chain; any provider without a key is skipped.
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      APP_ENV: ${APP_ENV:-development}
      # Sign-in only works through Supabase: point this at the dev project.
      SUPABASE_URL: ${SUPABASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - remote_ai_platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ─── Web (Next.js) ────────────────────────────────────────────────────────────
  web:
    build:
      # Root context (not apps/web) -- this is an npm workspaces monorepo,
      # the lockfile lives at the root, and the Dockerfile needs every
      # workspace's package.json present to resolve `npm ci` correctly.
      context: ../..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* vars are baked in at build time -- must be build args,
      # not just the `environment:` block below (which has no effect on them).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    container_name: remote-ai-platform-web
    restart: unless-stopped
    # Production image — no bind mount so the built .next output is used.
    # The Dockerfile CMD starts `next start` on port 3000.
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - remote_ai_platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Backend Tests ────────────────────────────────────────────────────────────
  test:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: test
    container_name: remote-ai-platform-test
    # Tests use an in-memory SQLite database, so no external services are needed.
    environment:
      APP_ENV: test
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_dev_password}
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - remote_ai_platform
    # Coverage floor: fail if coverage regresses (86% on 2026-09-27).
    command: python -m pytest /app/tests -v --cov=app --cov-report=term --cov-fail-under=80
