# Production backend on a single VM (Oracle Cloud Always Free or any Docker host).
#
#   cp infra/docker/.env.prod.example /opt/rap/.env   # then fill from Infisical:
#   infisical export --env=prod --path=/render-api --format=dotenv > /opt/rap/.env
#   docker compose --env-file /opt/rap/.env -f infra/docker/docker-compose.prod.yml up -d
#
# Containers: api, worker, scheduler, redis (private network only) and caddy
# (the only published ports: 80/443, automatic TLS). PostgreSQL stays external
# (Supabase today). The VM is a single point of failure: there is no second
# node, no load balancer and no automatic failover. Keep the previous hosting
# reachable until this stack has served real traffic through a release gate.
#
# Images come from GitHub Container Registry (built by CI) so the VM never
# builds; RAP_IMAGE pins the exact tested SHA.

name: rap-prod

networks:
  internal:
    driver: bridge
    internal: true     # redis/api/worker are unreachable from outside the host
  edge:
    driver: bridge

volumes:
  redis_data:
  caddy_data:
  caddy_config:

x-api-image: &api-image
  image: ${RAP_IMAGE:-ghcr.io/gokul-227/remote-ai-platform-api:latest}
  restart: unless-stopped
  env_file: ${RAP_ENV_FILE:-/opt/rap/.env}
  environment:
    REDIS_URL: redis://redis:6379/0
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - internal
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }

  api:
    <<: *api-image
    # Migrations run once at API start (start-production.sh); worker/scheduler wait for it.
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }

  worker:
    <<: *api-image
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "default,imports", "--concurrency", "2", "--max-tasks-per-child", "100", "--loglevel", "INFO"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }

  scheduler:
    <<: *api-image
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_PUBLIC_HOST:-api.remoteaiplatform.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - edge
    deploy:
      resources:
        limits: { memory: 128M }
