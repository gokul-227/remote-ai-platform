# Production backend on a single VM (Oracle Cloud Always Free or any Docker host).
#
#   cp infra/docker/.env.prod.example /opt/rap/.env   # then fill from Infisical:
#   infisical export --env=prod --path=/render-api --format=dotenv > /opt/rap/.env
#   docker compose --env-file /opt/rap/.env -f infra/docker/docker-compose.prod.yml up -d
#
# Containers: api, worker, scheduler, postgres and redis (private network only,
# no host ports), web (Next.js) and admin (static console) on loopback only,
# and caddy (the only public ports: 80/443, TLS via ACME DNS-01 at Cloudflare).
# PostgreSQL 17 runs here (volume postgres_data); set POSTGRES_PASSWORD in the
# env file. DATABASE_URL in the env file is overridden to the local postgres;
# set RAP_DATABASE_URL to point elsewhere (e.g. Supabase during a canary).
# Redis is local: Celery broker polling would exhaust a free Upstash quota. The VM is a single point of failure: there is no second
# node, no load balancer and no automatic failover. Keep the previous hosting
# reachable until this stack has served real traffic through a release gate.
#
# Images come from GitHub Container Registry (built by CI) so the VM never
# builds; RAP_IMAGE pins the exact tested SHA.

name: rap-prod

networks:
  internal:
    driver: bridge
    internal: true     # redis/api/worker are unreachable from outside the host
  edge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

x-api-image: &api-image
  image: ${RAP_IMAGE:-ghcr.io/gokul-227/remote-ai-platform-api:latest}
  restart: unless-stopped
  env_file: ${RAP_ENV_FILE:-/opt/rap/.env}
  environment:
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: ${RAP_DATABASE_URL:-postgresql+asyncpg://rap:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/remote_ai_platform}
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  networks:
    - internal
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: remote_ai_platform
      POSTGRES_USER: rap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
    shm_size: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    networks:
      - internal       # never published: reach it with docker exec or a container on rap-prod_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rap -d remote_ai_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { memory: 16G, cpus: "3.0" }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }

  api:
    <<: *api-image
    # Migrations run once at API start (start-production.sh); worker/scheduler wait for it.
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }

  worker:
    <<: *api-image
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "default,imports", "--concurrency", "2", "--max-tasks-per-child", "100", "--loglevel", "INFO"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }

  scheduler:
    <<: *api-image
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }

  web:
    # Next.js standalone server (apps/web/Dockerfile). Built per environment by
    # .github/workflows/deploy-vm.yml; WEB_IMAGE pins the commit SHA tag.
    image: ${WEB_IMAGE:-ghcr.io/gokul-227/remote-ai-platform-web:prod}
    restart: unless-stopped
    networks:
      - edge
    # Loopback only, for SSH-tunnel checks; public traffic goes through caddy.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.5" }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  admin:
    # Staff console static export on a tiny Caddy (apps/admin/Dockerfile).
    image: ${ADMIN_IMAGE:-ghcr.io/gokul-227/remote-ai-platform-admin:prod}
    restart: unless-stopped
    networks:
      - edge
    ports:
      - "127.0.0.1:3002:8080"
    deploy:
      resources:
        limits: { memory: 64M }

  caddy:
    # Custom build with the Cloudflare DNS (ACME DNS-01) and rate-limit plugins.
    image: ${CADDY_IMAGE:-ghcr.io/gokul-227/remote-ai-platform-caddy:latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_PUBLIC_HOST:-api.remoteaiplatform.com}
      WEB_HOST: ${WEB_PUBLIC_HOST:-remoteaiplatform.com}
      WWW_HOST: ${WWW_PUBLIC_HOST:-www.remoteaiplatform.com}
      ADMIN_HOST: ${ADMIN_PUBLIC_HOST:-admin.remoteaiplatform.com}
      # Zone:DNS:Edit token for ACME DNS-01 (Infisical prod:/ CLOUDFLARE_API_TOKEN).
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - admin
    networks:
      - edge
    deploy:
      resources:
        limits: { memory: 128M }
