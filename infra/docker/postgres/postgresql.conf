# PostgreSQL 17 on the production VM (OCI A1: 4 OCPU, 22 GB RAM, block storage).
# The same host also runs api/worker/scheduler (about 2.5 GB limits), so
# PostgreSQL is sized for roughly 16 GB of the 22 GB.
listen_addresses = '*'            # container network only; no host port is published
port = 5432
max_connections = 100             # api 2 workers x pool + worker + scheduler + backups

shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 32MB
maintenance_work_mem = 1GB
huge_pages = try

wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
wal_compression = on

random_page_cost = 1.1            # network block volume behaves like SSD
effective_io_concurrency = 200

max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

password_encryption = scram-sha-256
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'
timezone = 'UTC'
