global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    project: workmesh-ai

rule_files: []

scrape_configs:
  # WorkMesh FastAPI
  - job_name: workmesh-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # Traefik
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8090"]
    metrics_path: /metrics

  # PostgreSQL (via postgres_exporter — add if needed)
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # Redis (via redis_exporter — add if needed)
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Celery (via Flower)
  - job_name: celery-flower
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: /api/metrics
