# Render Blueprint for the FastAPI backend (free web service).
#
# Deploys apps/api's `production` Docker target as a single web service.
# There is no background worker: resume parsing runs inline with a time
# budget, and the job-source sync runs every 6 hours from
# .github/workflows/scheduled-job-sync.yml (POST /api/v1/jobs/sync).
#
# Render's free tier spins down after ~15 minutes idle and cold-starts on the
# next request. The database is a Supabase Postgres project (set DATABASE_URL
# in the dashboard); sign-in is Supabase Auth.

# Note: apps/api/Dockerfile's stages are intentionally ordered so `production`
# is the LAST stage — Render's Docker runtime has no target-selection field
# (confirmed against Render's own docs/community forum), so it always builds
# whatever stage is last when no --target is given.

services:
  - type: web
    name: remote-ai-platform-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    region: oregon
    # /health/live is a pure liveness ping (always 200, no dependency checks) --
    # it can never detect a real database outage. /health/ready checks DB
    # connectivity too (503 only if DB is down; Redis-down alone stays a 200
    # DEGRADED, so a cache outage never takes the API out of rotation).
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1" # free tier has 512MB RAM; keep uvicorn to a single worker
      - key: AI_PROVIDER
        value: auto # free-tier chain; providers without a key are skipped
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      # Set these in the Render dashboard (secrets, never committed); the full
      # list with sources is in the internal repo's go-live/owner-checklist.md:
      #   DATABASE_URL        postgresql+asyncpg://... (Supabase)
      #   SUPABASE_URL        https://<project>.supabase.co (token verification)
      #   CORS_ORIGINS        https://remoteaiplatform.com,...
      #   REDIS_URL           hosted Redis (rate limiting, cache, chat fan-out)
      #   MINIO_ENDPOINT, MINIO_PUBLIC_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
      #   MINIO_BUCKET_RESUMES, MINIO_BUCKET_ASSETS, MINIO_SECURE=true
      #                       Supabase Storage (S3-compatible)
      #   GROQ_API_KEY, GEMINI_API_KEY, CEREBRAS_API_KEY, OPENROUTER_API_KEY,
      #   MISTRAL_API_KEY     free-tier AI keys (any subset)
      #   EMAIL_PROVIDER=resend, RESEND_API_KEY
      #   SENTRY_DSN
