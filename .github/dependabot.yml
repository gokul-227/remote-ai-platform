# Weekly, grouped minor/patch dependency updates into dev (they pass the same required
# checks as any change before reaching prod). Security updates are separate
# and immediate (repository setting).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # Major versions are deliberate migrations, done in their own PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 10.74+ fails to load its Next.js instrumentation hook on Cloudflare
      # Workers (every page 500s); pinned at 10.73.0 until a release is
      # verified on Workers (incident 2026-10-03).
      - dependency-name: "@sentry/nextjs"
        versions: [">10.73.0"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /apps/api
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # Major versions are deliberate migrations, done in their own PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    target-branch: dev
    schedule: { interval: monthly }
    labels: [dependencies]
    ignore:
      # Major versions are deliberate migrations, done in their own PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
