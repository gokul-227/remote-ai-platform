# Weekly, grouped dependency updates into dev (they pass the same required
# checks as any change before reaching prod). Security updates are separate
# and immediate (repository setting).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /apps/api
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    target-branch: dev
    schedule: { interval: monthly }
    labels: [dependencies]
