name: Enforce branch flow

# Releases go dev -> prod only. `dev` is a CI branch: there is no dev
# environment any more, so CI on dev (and the PR's own checks) is the gate.

on:
  pull_request:
    branches: [prod]

permissions: {}

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify this PR's source is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs into 'prod' must come from 'dev', not '${{ github.head_ref }}'. Merge into dev first, then open a dev -> prod PR."
            exit 1
          fi
          echo "OK: prod is receiving from dev."

