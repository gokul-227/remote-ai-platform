name: CodeQL

# Static analysis security scan. Free for public repos. Runs on every PR/push
# to main/dev plus a weekly scheduled scan (catches newly-disclosed
# vulnerability patterns in code that hasn't changed).
on:
  push:
    # prod is the default branch; there is no main (OPS-05).
    branches: [prod, dev]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
