name: CodeQL

# Static analysis security scan. Free for public repos. Runs on every PR/push
# to main/dev plus a weekly scheduled scan (catches newly-disclosed
# vulnerability patterns in code that hasn't changed).
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
