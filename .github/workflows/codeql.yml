name: CodeQL

# Static analysis security scan. Free for public repos. Runs on every PR/push
# to main/dev plus a weekly scheduled scan (catches newly-disclosed
# vulnerability patterns in code that hasn't changed).
on:
  push:
    # prod is the default branch; there is no main (OPS-05).
    branches: [prod, dev]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  # Run by the docs-sync workflows for the commit they push to a PR branch.
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
