name: Publish API image (GHCR)

# Builds apps/api's production stage and pushes it to GitHub Container Registry
# so a Docker host (infra/docker/docker-compose.prod.yml) deploys a tested,
# pinned image instead of building on the VM. Runs after CI succeeds on dev or
# prod. Tags: the commit SHA (what RAP_IMAGE should pin) and the branch name.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, prod]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          branch="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository }}-api:${{ steps.meta.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
