name: Postman sync

# FastAPI -> docs/api/openapi.yaml -> postman/collections/ (Collection v3, YAML).
# Generated with Postman's own converter and CLI (tools/api_docs), validated
# with `postman collection lint` plus an OpenAPI coverage check.
#
# GitHub is the source of truth for the collection:
# - Pull requests: regenerate; on drift, same-repo PRs get a sync commit on the
#   PR branch (then CI, CodeQL and both sync workflows are dispatched for it,
#   since a GITHUB_TOKEN push triggers none); fork PRs fail with the drift
#   report and the regenerated files attached. Pushes to dev/prod only check.
# - live: start the API with local sign-in and run the whole committed
#   collection (every request's generated tests) with the Postman CLI, plus a
#   run against the generated mock, so what is merged demonstrably works.
# - publish (optional; POSTMAN_API_KEY secret + POSTMAN_WORKSPACE_ID variable):
#   mirror prod into that Postman workspace after every change and daily, so
#   edits made only in Postman are reverted (POSTMAN_PUSH_STRATEGY, default
#   force-sync, which also deletes what the repo no longer has -- use a
#   workspace dedicated to this repository).

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "tools/api_docs/**"
      - "tools/docs_report.py"
      - "tools/post_docs_report.sh"
      - "tools/package.json"
      - "tools/package-lock.json"
      - "docs/api/**"
      - "postman/**"
      - "Makefile"
      - "tests/e2e/mock-supabase/**"
      - ".github/workflows/postman-sync.yml"
  push:
    branches: [dev, prod]
    paths:
      - "apps/api/**"
      - "tools/api_docs/**"
      - "tools/docs_report.py"
      - "tools/post_docs_report.sh"
      - "tools/package.json"
      - "tools/package-lock.json"
      - "docs/api/**"
      - "postman/**"
      - "Makefile"
      - "tests/e2e/mock-supabase/**"
      - ".github/workflows/postman-sync.yml"
  schedule:
    - cron: "41 4 * * *" # daily re-mirror of prod into the Postman workspace
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: postman-sync-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: OpenAPI + Postman (generate, validate, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the sync commit to a same-repo PR branch
      actions: write # dispatch the checks for that commit
      pull-requests: write # the PR comment showing what changed
    env:
      AUTO_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      USER_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}
          fetch-depth: 0 # merge base for the PR comment's before/after

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Install API (to import the FastAPI app) and tooling
        # The OpenAPI document is read from the app object: no server, database
        # or secrets. export_openapi.py also ignores the environment.
        run: |
          pip install hatchling
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -e apps/api "pyyaml==6.0.3" "pytest==9.1.1"
          # Same npm workaround as ci.yml (optional platform packages); install scripts stay off.
          npm install -g npm@12.1.0
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund

      - name: Pipeline tests (fixture specs through the real converter and CLI)
        run: apps/api/.venv/bin/python -m pytest -q -p no:cacheprovider tools/tests/test_api_docs.py

      - name: Regenerate OpenAPI and Postman collection
        run: make api-sync

      - name: Detect drift
        id: drift
        run: |
          if [ -n "$(git status --porcelain -- docs/api postman)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### API documentation drift"
              echo '```'
              git status --short -- docs/api postman | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OpenAPI and Postman artifacts are up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit regenerated artifacts to the PR branch
        if: steps.drift.outputs.changed == 'true' && env.AUTO_COMMIT == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(git log -1 --format=%s)" = "docs: sync generated OpenAPI and Postman artifacts" ]; then
            echo "::error::Still drifting right after a sync commit -- generation is not deterministic. Not committing again."
            exit 1
          fi
          git config user.name "docs-sync[bot]"
          git config user.email "docs-sync@users.noreply.github.com"
          git add -A docs/api postman
          git commit -m "docs: sync generated OpenAPI and Postman artifacts"
          git fetch origin "$BRANCH" && git rebase FETCH_HEAD   # the architecture sync may have pushed first
          git push origin "HEAD:refs/heads/$BRANCH"
          if [ "$USER_TOKEN" != "true" ]; then
            # A GITHUB_TOKEN push starts no workflows: run the required checks
            # (and both sync checks) for the new head explicitly.
            for workflow in ci.yml codeql.yml architecture-sync.yml postman-sync.yml; do
              gh workflow run "$workflow" --ref "$BRANCH"
            done
          fi
          echo "Pushed a sync commit to $BRANCH; checks run on it." >> "$GITHUB_STEP_SUMMARY"

      - name: Show the changes in the pull request
        # One comment per kind, updated in place on every push: what changed
        # against the base branch (whoever regenerated it -- CI or the author).
        if: env.AUTO_COMMIT == 'true'
        continue-on-error: true # a comment failure must not block the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          PYTHON: apps/api/.venv/bin/python
        run: tools/post_docs_report.sh api

      - name: Upload regenerated artifacts
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: |
            docs/api/
            postman/collections/
          retention-days: 7

      - name: Fail on drift
        if: steps.drift.outputs.changed == 'true' && env.AUTO_COMMIT != 'true'
        run: |
          git stash --quiet --include-untracked -- docs/api postman
          make api-check || {
            echo "::error::API documentation drift detected. Run 'make api-sync' and commit docs/api/ and postman/."
            exit 1
          }

  live:
    name: Whole collection against a running API (Postman CLI)
    needs: sync
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Install tooling
        run: |
          pip install "pyjwt[crypto]==2.15.1"   # mock Supabase Auth
          npm install -g npm@12.1.0
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund

      - name: Collection against the generated mock (contract)
        run: make postman-test-mock

      - name: Start API on :8000 with local sign-in (no accounts, no secrets)
        run: |
          cp .env.example .env
          make postman-stack PYTHON=python3

      - name: Whole collection against the API (environment "local")
        run: make postman-test

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -p rap-e2e -f infra/docker/docker-compose.yml -f tests/e2e/docker-compose.e2e.yml logs --tail=100 api
          cat .cache/mock-supabase.log || true

  publish:
    name: Mirror into the Postman workspace
    needs: sync
    if: >
      vars.POSTMAN_WORKSPACE_ID != '' &&
      github.ref == 'refs/heads/prod' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: postman-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Mirror collection and environments
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ vars.POSTMAN_WORKSPACE_ID }}
          POSTMAN_PUSH_STRATEGY: ${{ vars.POSTMAN_PUSH_STRATEGY || 'force-sync' }}
        run: |
          set -euo pipefail
          if [ -z "$POSTMAN_API_KEY" ]; then
            echo "::notice::POSTMAN_API_KEY is not set; skipping the Postman publish."
            exit 0
          fi
          npm install -g npm@12.1.0
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          tools/api_docs/publish.sh | tee publish.log
          { echo "### Postman workspace mirrored from prod"; echo '```'; tail -40 publish.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
