name: Postman sync

# FastAPI app -> OpenAPI -> the Postman cloud collection. No Postman files live
# in the repository: the collection exists only in the Postman workspace.
#
# - openapi (PRs, pushes to dev/prod): regenerate docs/api/openapi.yaml from the
#   app and convert it to a collection (dry run, Postman is not contacted). On
#   drift, same-repo PRs get a sync commit on the PR branch (then CI, CodeQL and
#   both sync workflows are dispatched for it, since a GITHUB_TOKEN push
#   triggers none); fork PRs fail with the drift report and the regenerated
#   spec attached. Pushes to dev/prod only check.
# - publish (pushes to prod, manual runs on prod): rebuild the OpenAPI document
#   from the code into a temp file and update ONE existing collection through
#   the Postman API (tools/api_docs/postman_sync.mjs). Unchanged API -> nothing
#   is sent. Never runs for pull requests, so forks never reach the secret.
#
# Configuration: secret POSTMAN_API_KEY; variable POSTMAN_COLLECTION_ID (or
# POSTMAN_WORKSPACE_ID to find/create the collection by the API's title);
# optional variable POSTMAN_BASE_URL for the collection's {{baseUrl}}.

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "tools/api_docs/**"
      - "tools/docs_report.py"
      - "tools/post_docs_report.sh"
      - "tools/tests/test_api_docs.py"
      - "tools/package.json"
      - "tools/package-lock.json"
      - "docs/api/**"
      - "Makefile"
      - ".github/workflows/postman-sync.yml"
  push:
    branches: [dev, prod]
    paths:
      - "apps/api/**"
      - "tools/api_docs/**"
      - "tools/docs_report.py"
      - "tools/post_docs_report.sh"
      - "tools/tests/test_api_docs.py"
      - "tools/package.json"
      - "tools/package-lock.json"
      - "docs/api/**"
      - "Makefile"
      - ".github/workflows/postman-sync.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: postman-sync-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: OpenAPI (generate, convert, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the sync commit to a same-repo PR branch
      actions: write # dispatch the checks for that commit
      pull-requests: write # the PR comment showing what changed
    env:
      AUTO_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      USER_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}
          fetch-depth: 0 # merge base for the PR comment's before/after

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Install API (to import the FastAPI app) and tooling
        # The OpenAPI document is read from the app object: no server, database
        # or secrets. export_openapi.py also ignores the environment.
        run: |
          pip install hatchling
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -e apps/api "pyyaml==6.0.3" "pytest==9.1.1"
          # Same npm workaround as ci.yml (optional platform packages); install scripts stay off.
          npm install -g npm@12.1.0
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund

      - name: Pipeline tests (export, fixture specs through the real converter)
        run: apps/api/.venv/bin/python -m pytest -q -p no:cacheprovider tools/tests/test_api_docs.py

      - name: Regenerate OpenAPI
        run: |
          make api-sync || { echo "::error::❌ Failed to generate the OpenAPI specification."; exit 1; }

      - name: Convert to a Postman collection (dry run)
        run: node tools/api_docs/postman_sync.mjs docs/api/openapi.yaml --dry-run

      - name: Detect drift
        id: drift
        run: |
          if [ -n "$(git status --porcelain -- docs/api)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### OpenAPI drift"
              echo '```'
              git diff --stat -- docs/api
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OpenAPI document is up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit regenerated OpenAPI to the PR branch
        if: steps.drift.outputs.changed == 'true' && env.AUTO_COMMIT == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(git log -1 --format=%s)" = "docs: sync generated OpenAPI document" ]; then
            echo "::error::Still drifting right after a sync commit -- generation is not deterministic. Not committing again."
            exit 1
          fi
          git config user.name "docs-sync[bot]"
          git config user.email "docs-sync@users.noreply.github.com"
          git add docs/api
          git commit -m "docs: sync generated OpenAPI document"
          git fetch origin "$BRANCH" && git rebase FETCH_HEAD   # the architecture sync may have pushed first
          git push origin "HEAD:refs/heads/$BRANCH"
          if [ "$USER_TOKEN" != "true" ]; then
            # A GITHUB_TOKEN push starts no workflows: run the required checks
            # (and both sync checks) for the new head explicitly.
            for workflow in ci.yml codeql.yml architecture-sync.yml postman-sync.yml; do
              gh workflow run "$workflow" --ref "$BRANCH"
            done
          fi
          echo "Pushed a sync commit to $BRANCH; checks run on it." >> "$GITHUB_STEP_SUMMARY"

      - name: Show the changes in the pull request
        # One comment per kind, updated in place on every push: what changed
        # against the base branch (whoever regenerated it -- CI or the author).
        if: env.AUTO_COMMIT == 'true'
        continue-on-error: true # a comment failure must not block the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          PYTHON: apps/api/.venv/bin/python
        run: tools/post_docs_report.sh api

      - name: Upload regenerated OpenAPI
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi
          path: docs/api/
          retention-days: 7

      - name: Fail on drift
        if: steps.drift.outputs.changed == 'true' && env.AUTO_COMMIT != 'true'
        run: |
          git stash --quiet -- docs/api
          make api-check || {
            echo "::error::❌ OpenAPI document is out of date. Run 'make api-sync' and commit docs/api/."
            exit 1
          }

  publish:
    name: Update the Postman cloud collection
    needs: openapi
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: postman-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Install API (to import the FastAPI app) and the converter
        run: |
          pip install hatchling
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -e apps/api "pyyaml==6.0.3"
          npm install -g npm@12.1.0
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund

      - name: Generate OpenAPI from the code (temporary file)
        run: |
          apps/api/.venv/bin/python tools/api_docs/export_openapi.py "$RUNNER_TEMP/openapi.yaml" ||
            { echo "::error::❌ Failed to generate the OpenAPI specification."; exit 1; }

      - name: Sync the collection through the Postman API
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_ID: ${{ vars.POSTMAN_COLLECTION_ID }}
          POSTMAN_WORKSPACE_ID: ${{ vars.POSTMAN_WORKSPACE_ID }}
          POSTMAN_BASE_URL: ${{ vars.POSTMAN_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$POSTMAN_API_KEY" ]; then
            echo "::notice::POSTMAN_API_KEY is not set; skipping the Postman sync."
            exit 0
          fi
          node tools/api_docs/postman_sync.mjs "$RUNNER_TEMP/openapi.yaml" | tee "$RUNNER_TEMP/postman.log"
          { echo "### Postman collection"; echo '```'; cat "$RUNNER_TEMP/postman.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary OpenAPI document
        if: always()
        run: rm -f "$RUNNER_TEMP/openapi.yaml" "$RUNNER_TEMP/postman.log"
