name: Deploy frontend dev (Cloudflare)

# Mirrors deploy-frontend.yml but for the dev branch/environment -- separate
# Worker (remote-ai-platform-dev), separate dev.remoteaiplatform.com custom
# domain, separate dev Supabase project's public keys.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Workers
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://remote-ai-platform-api-dev.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_DEV }}
        run: npm run cf:build

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env dev

      - name: Attach dev.remoteaiplatform.com custom domain (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sf -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"environment\":\"production\",\"hostname\":\"dev.remoteaiplatform.com\",\"service\":\"remote-ai-platform-dev\",\"zone_id\":\"$CLOUDFLARE_ZONE_ID\"}"

      - name: Verify deploy
        run: |
          sleep 5
          curl -sf https://remote-ai-platform-dev.gokulraj22797.workers.dev/ -o /dev/null -w "dev homepage (workers.dev): %{http_code}\n"
