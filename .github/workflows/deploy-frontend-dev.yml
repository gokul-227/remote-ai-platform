name: Deploy frontend dev (Cloudflare)

# Mirrors deploy-frontend.yml but for the dev branch/environment -- separate
# Worker (remote-ai-platform-dev), separate dev.remoteaiplatform.com custom
# domain, separate dev Supabase project's public keys.
# See deploy-frontend.yml for why this requires event == 'push': CI also
# runs on pull_request (including from forks), and workflow_run's `branches`
# filter matches a fork PR's own head branch name -- e.g. a fork branch
# literally named "dev" would otherwise match here and let that PR's commit
# get built and deployed with this repo's real secrets.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install -g npm@latest && npm ci

      - name: Build for Cloudflare Workers
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://remote-ai-platform-api-dev.onrender.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_DEV }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run cf:build

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env dev

      - name: Attach dev.remoteaiplatform.com custom domain (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sf -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"environment\":\"production\",\"hostname\":\"dev.remoteaiplatform.com\",\"service\":\"remote-ai-platform-dev\",\"zone_id\":\"$CLOUDFLARE_ZONE_ID\"}"

      - name: Verify deploy
        run: |
          sleep 5
          curl -sf https://remote-ai-platform-dev.gokulraj22797.workers.dev/ -o /dev/null -w "dev homepage (workers.dev): %{http_code}\n"

  deploy-backend:
    # Render's own GitHub-integration auto-deploy has been unreliable (real
    # incident: several merges to dev sat undeployed for hours with no error
    # surfaced anywhere). A deploy hook is a plain authenticated URL Render
    # exposes per-service specifically to be called by external CI -- calling
    # it here makes the backend deploy an explicit, verifiable step in the
    # same pipeline as the frontend deploy, instead of an invisible
    # dependency on a webhook we can't inspect or debug.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Trigger Render deploy
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

      - name: Wait for the new version to actually be live
        # A plain "is /health up" check would pass instantly against the OLD
        # instance Render keeps serving while the new one builds -- that
        # would make this step useless for catching a failed deploy. Instead
        # poll for the specific version this commit ships, so the check only
        # passes once the NEW build is actually the one answering requests.
        run: |
          expected_version=$(grep -m1 '^version' apps/api/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Waiting for backend to report version ${expected_version}..."
          for i in $(seq 1 40); do
            live_version=$(curl -sf https://remote-ai-platform-api-dev.onrender.com/api/v1/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo "")
            if [ "$live_version" = "$expected_version" ]; then
              echo "Backend live at version ${live_version} after ${i} attempts."
              exit 0
            fi
            sleep 15
          done
          echo "Backend never reported version ${expected_version} within 10 minutes (last saw: ${live_version:-no response})"
          exit 1
