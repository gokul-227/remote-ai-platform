name: Build and push API image

# Builds apps/api's `production` Docker target and pushes it to GHCR (free
# for this repo). Northflank's free Developer Sandbox tier has no build
# capability at a reasonable price (the cheapest build-capable compute plan
# is ~$144/mo) -- so the image is built here instead, and Northflank just
# pulls and runs the pre-built image on its cheap deployment-only plans.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/build-api-image.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
