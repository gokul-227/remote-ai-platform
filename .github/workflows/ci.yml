name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Ruff lint (non-blocking — pre-existing debt, see docs/ACTUAL_SYSTEM_AUDIT.md)
        run: ruff check .
        continue-on-error: true

      - name: Mypy type check (non-blocking — pre-existing debt, see docs/ACTUAL_SYSTEM_AUDIT.md)
        run: mypy app
        continue-on-error: true

      - name: Run tests (Docker Compose test service)
        working-directory: .
        run: |
          docker compose -f infra/docker/docker-compose.yml build test
          docker compose -f infra/docker/docker-compose.yml run --rm test

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remote_ai_platform
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: remote_ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Run migrations against a fresh database
        env:
          DATABASE_URL: postgresql+asyncpg://remote_ai_platform:ci_test_password@localhost:5432/remote_ai_platform
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
        run: alembic upgrade head
