name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:

# Least-privilege default: none of these jobs push commits, create releases,
# or otherwise need write access to the repo -- they only check out code,
# run tests, and (for pull_request from a fork) get no repo secrets anyway.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

      - name: Mypy type check
        run: mypy app

      - name: Run tests (Docker Compose test service)
        working-directory: .
        run: |
          docker compose -f infra/docker/docker-compose.yml build test
          docker compose -f infra/docker/docker-compose.yml run --rm test

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # npm ci must run from the repo root — this is an npm workspaces
      # monorepo, the lockfile lives at the root, not in apps/web. Running
      # it from apps/web fails with "npm ci can only install with an
      # existing package-lock.json" (confirmed live against Vercel's build,
      # same underlying cause — see docs/ACTUAL_SYSTEM_AUDIT.md).
      - name: Install dependencies
        # The npm bundled with actions/setup-node hard-fails `npm ci` on an
        # unsupported-platform *optional* dependency (e.g. an esbuild
        # AIX/ppc64 binary) instead of skipping it as it's supposed to -- a
        # known npm bug, fixed in newer npm releases.
        run: npm install -g npm@12.1.0 && npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Formatting
        working-directory: apps/web
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit/component tests
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

  e2e:
    name: E2E (Playwright, real user journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # The npm bundled with actions/setup-node hard-fails `npm ci` on an
        # unsupported-platform *optional* dependency (e.g. an esbuild
        # AIX/ppc64 binary) instead of skipping it as it's supposed to -- a
        # known npm bug, fixed in newer npm releases.
        run: npm install -g npm@12.1.0 && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start mock Supabase Auth
        # The suite signs in against a local stand-in for Supabase Auth, so CI
        # never touches a real Supabase project, real email or production
        # accounts, and needs no secrets (safe for fork PRs too).
        run: |
          pip install --quiet "pyjwt[crypto]==2.13.0"
          ISSUER=http://host.docker.internal:9999/auth/v1 PORT=9999 nohup python3 tests/e2e/mock-supabase/server.py > mock-supabase.log 2>&1 &
          timeout 30 sh -c 'until curl -sf http://localhost:9999/auth/v1/.well-known/jwks.json; do sleep 1; done'

      - name: Start isolated stack
        run: |
          cp .env.example .env
          docker compose -p rap-e2e -f infra/docker/docker-compose.yml -f tests/e2e/docker-compose.e2e.yml \
            up -d --build postgres redis minio minio-init api web
          timeout 180 sh -c 'until curl -sf http://localhost:18000/health/ready; do sleep 3; done'
          timeout 120 sh -c 'until curl -sf http://localhost:13000/; do sleep 3; done'

      - name: Run E2E suite
        working-directory: tests/e2e
        run: npx playwright test

      # Keeping this permanently (not just for this investigation): it's what
      # actually surfaced the real root cause of a prior E2E failure -- a
      # captured `POST .../auth/v1/otp` -> 429 network entry in trace.zip --
      # after `docker compose logs` alone (below) had scrolled the relevant
      # request off screen. Playwright only writes these files on failure, so
      # the upload step costs nothing on green runs.
      - name: Upload Playwright trace/report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 3

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -p rap-e2e -f infra/docker/docker-compose.yml -f tests/e2e/docker-compose.e2e.yml logs --tail=200
          cat mock-supabase.log || true

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remote_ai_platform
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: remote_ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Run migrations against a fresh database
        env:
          DATABASE_URL: postgresql+asyncpg://remote_ai_platform:ci_test_password@localhost:5432/remote_ai_platform
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long # gitleaks:allow -- CI-only fixture, not a real secret
        run: alembic upgrade head

      - name: Concurrency tests on PostgreSQL
        # The unit suite runs on SQLite, which cannot prove row locking or
        # unique-constraint races; these run against the migrated database.
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://remote_ai_platform:ci_test_password@localhost:5432/remote_ai_platform
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long # gitleaks:allow -- CI-only fixture, not a real secret
        run: pytest -q -p no:cacheprovider tests/test_postgres_concurrency.py
