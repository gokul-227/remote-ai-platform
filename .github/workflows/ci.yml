name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

      - name: Mypy type check
        run: mypy app

      - name: Run tests (Docker Compose test service)
        working-directory: .
        run: |
          docker compose -f infra/docker/docker-compose.yml build test
          docker compose -f infra/docker/docker-compose.yml run --rm test

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # npm ci must run from the repo root — this is an npm workspaces
      # monorepo, the lockfile lives at the root, not in apps/web. Running
      # it from apps/web fails with "npm ci can only install with an
      # existing package-lock.json" (confirmed live against Vercel's build,
      # same underlying cause — see docs/ACTUAL_SYSTEM_AUDIT.md).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://cvjypjsjmamoppwhuwdl.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_E9A2lRDUNRr8CI8RxpSWtA_Szi21la2
        run: npm run build

  e2e:
    name: E2E (Playwright, real user journeys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start stack
        env:
          # Production now verifies Supabase-issued tokens exclusively
          # (AUTH_PROVIDER=supabase) -- test against the same thing so E2E
          # coverage matches what's actually deployed, not the old local-only
          # auth path.
          AUTH_PROVIDER: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cp .env.example .env
          npm run docker:up
          timeout 120 sh -c 'until curl -sf http://localhost:8000/api/v1/health; do sleep 3; done'
          timeout 60 sh -c 'until curl -sf http://localhost:3000/; do sleep 3; done'

      - name: Seed demo data (creates admin@workmesh.ai used by the admin journey test)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          docker exec remote-ai-platform-api python -m app.scripts.seed_data

          # seed_data.py creates admin@workmesh.ai as a LOCAL row only, with
          # no Supabase Auth identity -- the frontend now logs in exclusively
          # through Supabase, so create/confirm a matching Supabase user too.
          # get_or_create_user_from_token() links it to the existing local
          # row by email match on first authenticated request -- no manual
          # DB linking needed here.
          # Idempotent: runs on every push, so a 422 "already registered" on
          # later runs is expected and fine -- the account persists as a
          # stable CI fixture, created fresh only on the first-ever run.
          curl -s -X POST "$SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@workmesh.ai","password":"admin123","email_confirm":true}' \
            -o /dev/null -w "Supabase admin user: %{http_code}\n"

      - name: Run E2E suite
        working-directory: tests/e2e
        env:
          # registerAs() and the admin-journey non-admin test create/confirm
          # users directly against Supabase Auth (see helpers.ts) since
          # production requires email confirmation and there's no inbox in CI.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx playwright test

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --tail=200

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remote_ai_platform
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: remote_ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Run migrations against a fresh database
        env:
          DATABASE_URL: postgresql+asyncpg://remote_ai_platform:ci_test_password@localhost:5432/remote_ai_platform
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
        run: alembic upgrade head
