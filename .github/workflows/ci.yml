name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:

# Least-privilege default: none of these jobs push commits, create releases,
# or otherwise need write access to the repo -- they only check out code,
# run tests, and (for pull_request from a fork) get no repo secrets anyway.
permissions:
  contents: read

jobs:
  secrets:
    # Part of CI (not a separate workflow) so deploys, which wait for CI,
    # never ship a commit with a leaked secret. Exceptions: .gitleaks.toml.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only used to comment on a PR when a leak is found
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app

      - name: Mypy type check
        run: mypy app

      - name: Run tests (Docker Compose test service)
        working-directory: .
        run: |
          docker compose -f infra/docker/docker-compose.yml build test
          docker compose -f infra/docker/docker-compose.yml run --rm test

      - name: Repo-level tests (backup safety, cache guard)
        # These read ops/ and infra/, which are outside the test image's build
        # context, so they skipped inside Docker and never ran in CI. Run them
        # here against the full checkout, and fail if any of them skip.
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider -rs tests/test_backup_tools.py tests/test_job_list_cache.py | tee repo-tests.log
          if grep -q "SKIPPED" repo-tests.log; then echo "::error::repo-level tests skipped"; exit 1; fi

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # npm ci must run from the repo root — this is an npm workspaces
      # monorepo, the lockfile lives at the root, not in apps/web. Running
      # it from apps/web fails with "npm ci can only install with an
      # existing package-lock.json".
      - name: Install dependencies
        # The npm bundled with actions/setup-node hard-fails `npm ci` on an
        # unsupported-platform *optional* dependency (e.g. an esbuild
        # AIX/ppc64 binary) instead of skipping it as it's supposed to -- a
        # known npm bug, fixed in newer npm releases.
        run: npm install -g npm@12.1.0 && npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Formatting
        working-directory: apps/web
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit/component tests
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

  e2e:
    name: E2E (Playwright, real user journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # The npm bundled with actions/setup-node hard-fails `npm ci` on an
        # unsupported-platform *optional* dependency (e.g. an esbuild
        # AIX/ppc64 binary) instead of skipping it as it's supposed to -- a
        # known npm bug, fixed in newer npm releases.
        run: npm install -g npm@12.1.0 && npm ci

      - name: Install Playwright browsers
        # Normally under a minute. A stalled download once held this step for
        # 20+ minutes; give each attempt 5 minutes and retry once.
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 300 npx playwright install --with-deps chromium webkit firefox && exit 0
            echo "::warning::browser install attempt $attempt failed or stalled"
          done
          exit 1

      - name: Start mock Supabase Auth
        # The suite signs in against a local stand-in for Supabase Auth, so CI
        # never touches a real Supabase project, real email or production
        # accounts, and needs no secrets (safe for fork PRs too).
        run: |
          pip install --quiet "pyjwt[crypto]==2.13.0"
          ISSUER=http://host.docker.internal:9999/auth/v1 PORT=9999 nohup python3 tests/e2e/mock-supabase/server.py > mock-supabase.log 2>&1 &
          timeout 30 sh -c 'until curl -sf http://localhost:9999/auth/v1/.well-known/jwks.json; do sleep 1; done'

      - name: Start isolated stack
        run: |
          cp .env.example .env
          docker compose -p rap-e2e -f infra/docker/docker-compose.yml -f tests/e2e/docker-compose.e2e.yml \
            up -d --build postgres redis minio minio-init api web
          timeout 180 sh -c 'until curl -sf http://localhost:18000/health/ready; do sleep 3; done'
          timeout 120 sh -c 'until curl -sf http://localhost:13000/; do sleep 3; done'

      - name: Run E2E suite
        working-directory: tests/e2e
        run: npx playwright test

      # Keeping this permanently (not just for this investigation): it's what
      # actually surfaced the real root cause of a prior E2E failure -- a
      # captured `POST .../auth/v1/otp` -> 429 network entry in trace.zip --
      # after `docker compose logs` alone (below) had scrolled the relevant
      # request off screen. Playwright only writes these files on failure, so
      # the upload step costs nothing on green runs.
      - name: Upload Playwright trace/report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 3

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -p rap-e2e -f infra/docker/docker-compose.yml -f tests/e2e/docker-compose.e2e.yml logs --tail=200
          cat mock-supabase.log || true

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remote_ai_platform
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: remote_ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"

      - name: Run migrations against a fresh database (two migrators at once)
        # Every instance migrates at startup; two booting together must both
        # succeed (alembic/env.py serialises them with an advisory lock).
        env:
          DATABASE_URL: postgresql+asyncpg://remote_ai_platform:ci_test_password@localhost:5432/remote_ai_platform
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long # gitleaks:allow -- CI-only fixture, not a real secret
        run: |
          alembic upgrade head & first=$!
          alembic upgrade head & second=$!
          wait $first && wait $second
          alembic current | grep -q "(head)"

      - name: Concurrency tests on PostgreSQL
        # The unit suite runs on SQLite, which cannot prove row locking or
        # unique-constraint races; these run against the migrated database.
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://remote_ai_platform:ci_test_password@localhost:5432/remote_ai_platform
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long # gitleaks:allow -- CI-only fixture, not a real secret
        run: pytest -q -p no:cacheprovider tests/test_postgres_concurrency.py
