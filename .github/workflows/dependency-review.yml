name: Dependency Review

# Blocks a PR that introduces a new dependency with a known high/critical
# vulnerability, or a license outside an allowed set. Free for public repos.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
