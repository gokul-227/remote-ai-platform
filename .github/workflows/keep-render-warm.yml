name: Keep Render API warm

# Render's free web service tier sleeps after 15 minutes with no inbound
# traffic and takes 30-60s to cold-start on the next request. Pinging it
# more often than that keeps it permanently warm for real users, at $0 --
# this repo is public, so GitHub Actions minutes are unlimited/free here.
# Not a ToS violation (Render doesn't prohibit this, just doesn't officially
# support it as a substitute for a paid always-on instance).
#
# Math check: pinging keeps the service running ~24/7, which uses roughly
# 720-744 of Render's 750 free instance-hours/month -- fits, as long as
# this is the ONLY free service in the Render account. Do not add a second
# always-on free Render service without re-checking this budget.

on:
  schedule:
    # Offset from round minute marks (:00/:10/:20...) on purpose -- GitHub's
    # own docs warn schedules on exact interval boundaries hit the highest
    # queue congestion and can be delayed arbitrarily. Firing at :03/:13/:23
    # etc. avoids that contention.
    - cron: "3-59/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 20 https://remote-ai-platform-api.onrender.com/health/live || true
