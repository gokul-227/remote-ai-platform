name: Production canary

# Alerting at $0: when a check fails this scheduled run fails, and GitHub
# emails the repository owner. (keep-render-warm.yml only wakes the API
# and never fails.) Checks what users depend on, not just "is it up".
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: API is ready
        run: |
          code=$(curl -s --max-time 60 -o /dev/null -w "%{http_code}" "${{ vars.PROD_API_BASE_URL }}/health/ready")
          [ "$code" = "200" ] || { echo "::error::/health/ready answered $code"; exit 1; }

      - name: Public job list works and ingestion is fresh
        # A stale newest posting means the six-hourly sync has stopped.
        run: |
          body=$(curl -sf --max-time 60 "${{ vars.PROD_API_BASE_URL }}/api/v1/jobs?limit=1")
          newest=$(echo "$body" | python3 -c "import json,sys; j=json.load(sys.stdin); print(j[0]['posted_at'] if j else '')")
          [ -n "$newest" ] || { echo "::error::public job list is empty"; exit 1; }
          python3 - "$newest" <<'PY'
          import sys
          from datetime import datetime, timezone
          newest = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          if newest.tzinfo is None:
              newest = newest.replace(tzinfo=timezone.utc)
          age_h = (datetime.now(timezone.utc) - newest).total_seconds() / 3600
          print(f"newest job is {age_h:.1f} h old")
          if age_h > 48:
              print("::error::no new jobs for 48 h: check scheduled-job-sync.yml")
              sys.exit(1)
          PY

      - name: Every job source still syncs, and no erasure is stuck (OBS-03)
        # The newest posting stays fresh while any one source works; check each
        # source that synced in the last 14 days. A source with no success in
        # 24 h (four six-hourly runs) or an account erasure pending for over a
        # day fails the run.
        run: |
          curl -sf --max-time 60 "${{ vars.PROD_API_BASE_URL }}/health/ingestion" > ingestion.json
          python3 - ingestion.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          bad = []
          for name, s in sorted(d["sources"].items()):
              h = s["hours_since_success"]
              print(f"{name}: last success {h} h ago, {s['failures_since_success']} failures since, fetched {s['last_success_fetched']}")
              if h is not None and h > 24:
                  bad.append(f"{name} has not synced for {h} h")
          if d["identity_erasures_overdue"]:
              bad.append(f"{d['identity_erasures_overdue']} account erasure(s) pending over 24 h: "
                         "POST /api/v1/admin/erasures/retry and check SUPABASE_SERVICE_ROLE_KEY")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY

      - name: Website serves
        run: curl -sf --max-time 30 -o /dev/null "${{ vars.PROD_FRONTEND_URL }}/"
