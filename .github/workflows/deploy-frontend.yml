name: Deploy frontend (Cloudflare)

# Runs only after CI has passed on main, not on every raw push -- broken
# code never gets deployed just because it merged.
#
# workflow_run's `branches` filter matches on the *head* branch name of the
# workflow run it's reacting to. CI also runs on `pull_request` (including
# from forks), and for a pull_request-triggered run, head_branch is the
# contributor's own branch name in their fork -- so an attacker who names a
# fork branch "prod" and opens a PR would otherwise produce a completed "CI"
# workflow_run with branches: [prod] matching, letting this job check out
# and deploy their fork commit using this repo's real Cloudflare/Sentry/
# Supabase secrets. Restricting to `event == 'push'` closes that: a push
# event to this exact branch can only originate from someone with write
# access to this repository, never from a fork's pull_request run. The
# head_repository check is redundant with that but kept as defense in depth.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [prod]
    types: [completed]

permissions:
  contents: read

# One deploy per environment at a time, in order. Never cancel a deploy
# midway; a queued older run is skipped by the `current` gate below.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  current:
    timeout-minutes: 5
    # Deploy only the commit that is still the tip of the branch. Without
    # this, a slow run for an older commit could finish after a newer one
    # and put stale code back live.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/git/ref/heads/prod" --jq .object.sha)
          if [ "$tip" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: ${{ github.event.workflow_run.head_sha }} is no longer the tip of prod ($tip)."
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: current
    timeout-minutes: 20
    if: needs.current.outputs.is_tip == 'true'
    environment:
      name: production
      url: https://remoteaiplatform.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install -g npm@12.1.0 && npm ci

      - name: Record build time
        run: echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build for Cloudflare Workers
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          NEXT_PUBLIC_DEPLOY_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.PROD_FRONTEND_URL }}
          NEXT_PUBLIC_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          NEXT_PUBLIC_API_URL: ${{ vars.PROD_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run cf:build

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify deploy
        run: |
          sleep 5
          expected="${{ github.event.workflow_run.head_sha }}"
          live=""
          for i in $(seq 1 12); do
            live=$(curl -sf --max-time 15 "${{ vars.PROD_FRONTEND_WORKERSDEV_URL }}/api/version" | python3 -c "import json,sys; print(json.load(sys.stdin).get('git_sha',''))" 2>/dev/null || echo "")
            [ "$live" = "$expected" ] && break
            sleep 5
          done
          if [ "$live" != "$expected" ]; then
            echo "Frontend reports git_sha '${live:-no response}', expected $expected"
            exit 1
          fi
          echo "Frontend live at $live"
          curl -sf --max-time 15 "${{ vars.PROD_FRONTEND_URL }}/" -o /dev/null -w "homepage (custom domain): %{http_code}\n"
          curl -sf --max-time 15 "${{ vars.PROD_FRONTEND_WORKERSDEV_URL }}/" -o /dev/null -w "homepage (workers.dev): %{http_code}\n"

      - name: Smoke test the live site
        # The right SHA is not enough: the page must serve and crawler policy
        # must match the environment (production indexable, dev not).
        run: |
          curl -sf --max-time 15 "${{ vars.PROD_FRONTEND_WORKERSDEV_URL }}/robots.txt" | tee /dev/stderr | grep -qx "Allow: /"
          curl -sf --max-time 15 -o /dev/null "${{ vars.PROD_FRONTEND_WORKERSDEV_URL }}/#jobs"

  deploy-backend:
    # Render's own GitHub-integration auto-deploy has been unreliable (real
    # incident: several merges to prod/dev sat undeployed for hours with no
    # error surfaced anywhere). A deploy hook is a plain authenticated URL
    # Render exposes per-service specifically to be called by external CI --
    # calling it here makes the backend deploy an explicit, verifiable step
    # in the same pipeline as the frontend deploy, instead of an invisible
    # dependency on a webhook we can't inspect or debug.
    needs: current
    timeout-minutes: 30
    if: needs.current.outputs.is_tip == 'true'
    environment:
      name: production
      url: ${{ vars.PROD_API_BASE_URL }}/health/version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Trigger Render deploy
        # The prod API (Frankfurt, api.remoteaiplatform.com since 2026-10-03)
        # auto-deploys the prod branch once its GitHub checks pass (Render
        # autoDeployTrigger = checksPass), so no hook is needed. If
        # RENDER_DEPLOY_HOOK_PROD is set, ref= deploys exactly the CI-tested commit.
        run: |
          hook="${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
          if [ -z "$hook" ]; then
            echo "No deploy hook: Render auto-deploys this commit after checks pass."
            exit 0
          fi
          case "$hook" in *\?*) sep="&" ;; *) sep="?" ;; esac
          curl -sf --max-time 60 -X POST "${hook}${sep}ref=${{ github.event.workflow_run.head_sha }}"

      - name: Wait for the new commit to actually be live
        # A plain "is /health up" check would pass instantly against the OLD
        # instance Render keeps serving while the new one builds -- that
        # would make this step useless for catching a failed deploy. Poll
        # /health/version's git_sha instead of a manually-maintained version
        # number: Render auto-populates RENDER_GIT_COMMIT on every deploy, so
        # this always changes on a real deploy without anyone needing to
        # remember to bump anything (a hardcoded APP_VERSION string is NOT a
        # reliable deploy signal -- confirmed the hard way when this exact
        # check was first written and it never moved without a real deploy
        # actually changing it. Note: RENDER_GIT_COMMIT reflects the FULL
        # commit SHA Render checked out, which is this workflow's own
        # head_sha because the hook above is called with ref=head_sha).
        run: |
          expected_sha="${{ github.event.workflow_run.head_sha }}"
          echo "Waiting for backend to report git_sha ${expected_sha}..."
          for i in $(seq 1 80); do
            live_sha=$(curl -sf --max-time 15 "${{ vars.PROD_API_BASE_URL }}/health/version" | python3 -c "import json,sys; print(json.load(sys.stdin).get('git_sha',''))" 2>/dev/null || echo "")
            if [ "$live_sha" = "$expected_sha" ]; then
              echo "Backend live at commit ${live_sha} after ${i} attempts."
              exit 0
            fi
            sleep 15
          done
          echo "Backend never reported git_sha ${expected_sha} within 20 minutes (last saw: ${live_sha:-no response})"
          exit 1

      - name: Smoke test the live API
        run: |
          ready=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "${{ vars.PROD_API_BASE_URL }}/health/ready")
          [ "$ready" = "200" ] || { echo "/health/ready answered $ready"; exit 1; }
          total=$(curl -sf --max-time 30 -D - -o /dev/null "${{ vars.PROD_API_BASE_URL }}/api/v1/jobs?limit=1" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-total-count"{print $2}')
          [ "${total:-0}" -gt 0 ] || { echo "public job list returned no jobs (X-Total-Count=${total:-missing})"; exit 1; }
          echo "API ready; $total public jobs"
