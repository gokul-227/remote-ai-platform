name: Scheduled job source sync (production)

# Replaces Celery beat's job-source sync cron for the $0 deployment, which
# intentionally has no hosted Redis/worker (see infra/deploy/render.yaml and
# docs/DEPLOYMENT_ZERO_COST.md). Logs in as a dedicated Supabase Auth service
# account (ci-service@remote-ai-platform.internal, promoted to ADMIN in the
# app's own users table) and hits the same POST /jobs/sync endpoint Celery
# beat calls locally every 6h.
#
# The production API now only verifies Supabase-issued tokens (AUTH_PROVIDER
# =supabase) -- this workflow authenticates against Supabase's own token
# endpoint, not this app's old (now dormant) /auth/login.
#
# Requires repository secrets (Settings → Secrets → Actions):
#   PROD_ADMIN_EMAIL, PROD_ADMIN_PASSWORD  -- the service account's credentials
#   SUPABASE_URL, SUPABASE_ANON_KEY        -- to call Supabase's token endpoint
# and one repository variable (Settings → Secrets → Actions → Variables):
#   PROD_API_URL   e.g. https://remote-ai-platform-api.onrender.com/api/v1

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Log in and trigger job sync
        run: |
          set -euo pipefail
          API_URL="${{ vars.PROD_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "PROD_API_URL repository variable is not set — skipping (deployment not configured yet)."
            exit 0
          fi

          TOKEN=$(curl -sf -X POST "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.PROD_ADMIN_EMAIL }}\",\"password\":\"${{ secrets.PROD_ADMIN_PASSWORD }}\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")

          curl -sf -X POST "$API_URL/jobs/sync" \
            -H "Authorization: Bearer $TOKEN" \
            -w "\nHTTP %{http_code}\n"
