name: Scheduled job source sync (production)

# The six-hourly job-source sync for the $0 deployment (no hosted worker).
# Authorised by JOB_SYNC_TOKEN, which can trigger this sync (plus its
# maintenance: erasure retries, email outbox drain) and nothing else. The old
# administrator-password fallback and its service account were retired on
# 2026-10-03.
#
# Requires: repository secret JOB_SYNC_TOKEN and repository variable
# PROD_API_URL (the production API base URL + /api/v1).

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

# This job never checks out the repo or calls the GitHub API -- it doesn't
# need any GITHUB_TOKEN permission at all.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Trigger job sync
        run: |
          set -euo pipefail
          API_URL="${{ vars.PROD_API_URL }}"
          SYNC_TOKEN="${{ secrets.JOB_SYNC_TOKEN }}"
          if [ -z "$API_URL" ] || [ -z "$SYNC_TOKEN" ]; then
            echo "::error::PROD_API_URL or JOB_SYNC_TOKEN is not configured"
            exit 1
          fi
          # One source per request keeps each import small enough for the free API
          # instance (512 MB); a failing source doesn't stop the others.
          failed=0
          for src in REMOTEOK ARBEITNOW REMOTIVE THEMUSE USAJOBS JOBICY HIMALAYAS WORKINGNOMADS \
                     GREENHOUSE LEVER ASHBY SMARTRECRUITERS ADZUNA JOOBLE; do
            echo "::group::$src"
            if ! curl -sf --max-time 600 -X POST "$API_URL/jobs/sync/scheduled?source=$src" \
                 -H "X-Job-Sync-Token: $SYNC_TOKEN" -w "\nHTTP %{http_code}\n"; then
              echo "::warning::$src import failed"; failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          # Retention, size budget, pending erasures and the email backstop, once.
          curl -sf --max-time 600 -X POST "$API_URL/jobs/sync/scheduled?step=maintenance" \
            -H "X-Job-Sync-Token: $SYNC_TOKEN" -w "\nHTTP %{http_code}\n"
          [ "$failed" -lt 7 ] || { echo "::error::$failed sources failed"; exit 1; }
