name: Bug report
description: Something on Remote AI Platform does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the page URL and what you expected instead. Never include passwords, codes or other people's data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Click …\n3. See …"
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Where?
      options: [Production (remoteaiplatform.com), Dev (dev.remoteaiplatform.com)]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "e.g. Safari 18 on iPhone 15"
