[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
license = { text = "Proprietary" }
name = "remote-ai-platform-api"
version = "0.1.1"
description = "Remote AI Platform — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.142.2",
    # Pinned explicitly (not just left to fastapi's own transitive range) to
    # force in the fix for several starlette CVEs (host-header/path request.url
    # reconstruction, unbounded urlencoded form parsing, HTTPEndpoint method
    # dispatch) that aren't closed until 1.0.1/1.1.0/1.3.0/1.3.1 respectively --
    # fastapi==0.142.2 alone would still resolve to an older, vulnerable 0.5x.
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",

    # Database
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "alembic==1.20.0",

    # Validation
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",

    # Auth & Security
    "pyjwt[crypto]==2.15.1",
    "httpx>=0.28.0",

    # Background tasks

    # Object storage
    "boto3==1.43.108",

    # AI (litellm pulls in openai + aiohttp transitively)
    "litellm==1.103.2",

    # Resume text extraction (PDF/DOCX -> plain text, ahead of AI parsing)
    "pypdf==6.19.0",
    "python-docx==1.2.0",

    # Caching
    "redis[hiredis]==5.3.1",

    # Monitoring & Logging
    "prometheus-fastapi-instrumentator==8.1.0",
    "structlog==24.4.0",

    # Payments
    "stripe==11.6.0",

    # Error monitoring (no-op until SENTRY_DSN is configured -- see app/main.py)
    "sentry-sdk[fastapi]==2.71.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov==6.3.0",
    "httpx>=0.28.0",
    "factory-boy==3.3.3",
    "faker==33.3.1",
    "ruff==0.16.10",
    "mypy==1.20.2",
    "pre-commit==4.6.2",
    "asgi-lifespan==2.1.0",
    "aiosqlite==0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
# SQLAlchemy's async layer runs code inside greenlets; without this, coverage
# misses everything after the first database await (e.g. whole endpoints).
concurrency = ["greenlet", "thread"]
