[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "remote-ai-platform-api"
version = "0.1.1"
description = "Remote AI Platform — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.141.1",
    # Pinned explicitly (not just left to fastapi's own transitive range) to
    # force in the fix for several starlette CVEs (host-header/path request.url
    # reconstruction, unbounded urlencoded form parsing, HTTPEndpoint method
    # dispatch) that aren't closed until 1.0.1/1.1.0/1.3.0/1.3.1 respectively --
    # fastapi==0.141.1 alone would still resolve to an older, vulnerable 0.5x.
    "starlette==1.6.0",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.31",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",

    # Validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",

    # Auth & Security
    "python-jose[cryptography]==3.5.0",
    "pyjwt[crypto]==2.13.0",
    "passlib[bcrypt]==1.7.4",
    "httpx>=0.28.0",

    # Background tasks
    "celery[redis]==5.4.0",
    "flower==2.0.1",

    # Object storage
    "boto3==1.35.75",

    # AI (litellm pulls in openai + aiohttp transitively)
    "litellm==1.84.0",

    # Resume text extraction (PDF/DOCX -> plain text, ahead of AI parsing)
    "pypdf==6.16.1",
    "python-docx==1.1.2",

    # Caching
    "redis[hiredis]==5.2.1",

    # Monitoring & Logging
    "prometheus-fastapi-instrumentator==8.1.0",
    "structlog==24.4.0",

    # Payments
    "stripe==11.4.1",

    # Error monitoring (no-op until SENTRY_DSN is configured -- see app/main.py)
    "sentry-sdk[fastapi]==2.68.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov==6.0.0",
    "httpx>=0.28.0",
    "factory-boy==3.3.1",
    "faker==33.1.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "asgi-lifespan==2.1.0",
    "aiosqlite==0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
