# Architecture catalog: the rules that turn repository evidence into the
# architecture model (docs/architecture/architecture.yaml).
#
# A component appears in the model only when at least one of its `detect`
# rules matches the repository; connections appear only when both ends exist.
# Nothing here is inferred by an LLM. When the discovery reports something it
# cannot classify (a new AI provider, job board, runtime dependency or
# external-service setting), add it here -- either as a component or under
# `ignore` with a reason.
#
# Rule types (all paths relative to the repository root):
#   python_dep: <name>                 apps/api/pyproject.toml runtime dependency
#   node_dep: <name>                   apps/web/package.json runtime dependency
#   setting: <NAME>                    field of Settings in apps/api/app/core/config.py
#   file: <glob>                       a file exists
#   file_contains: {glob, regex}       a matching file contains the regex
#
# `status` (optional) marks a detected component as disabled when a Settings
# default says so: {setting: NAME, enabled_when: true}.

system:
  name: Remote AI Platform
  description: Remote-work marketplace — job aggregation, AI-assisted profiles, explainable matching, contracted work.

# Boundaries drawn on the diagram. `row` is ops (delivery band, top), main
# (request path, default) or external (providers, bottom); `column` orders
# groups left to right within a row.
groups:
  - {id: clients, name: Clients, provider: Internet, column: 0}
  - {id: cloudflare, name: Cloudflare, provider: Cloudflare, icon: cloudflare, column: 1}
  - {id: render, name: Render, provider: Render, icon: render, column: 2}
  - {id: supabase, name: Supabase (EU), provider: Supabase, icon: supabase, column: 3}
  - {id: cache, name: Managed Redis, provider: Redis host via REDIS_URL, icon: redis, column: 3}
  - {id: ai-providers, name: AI providers (LiteLLM free-tier chain), provider: Multiple, row: external, column: 1}
  - {id: job-boards, name: Job boards (public APIs), provider: Multiple, row: external, column: 2}
  - {id: saas, name: Third-party services, provider: Multiple, row: external, column: 3}
  - {id: github, name: GitHub Actions, provider: GitHub, icon: githubactions, row: ops, column: 1}
  - {id: secrets, name: Secrets management, provider: Infisical, row: ops, column: 3}

components:
  - id: users
    name: Users
    type: actor
    technology: Browser (professionals, organisations, admins)
    group: clients
    detect:
      - file: apps/web/package.json

  - id: web
    name: Web application
    type: application
    technology: "Next.js {node_dep_major:next} · OpenNext"
    provider: Cloudflare Workers
    group: cloudflare
    icon: nextdotjs
    detect:
      - file_contains: {glob: apps/web/wrangler.jsonc, regex: '"main"'}

  - id: api
    name: Backend API
    type: application
    technology: "FastAPI {python_dep_major:fastapi} · Docker"
    provider: Render web service
    group: render
    icon: fastapi
    detect:
      - file_contains: {glob: infra/deploy/render.yaml, regex: 'type:\s*web'}

  - id: worker
    name: Background worker
    type: worker
    technology: Task queue
    group: render
    detect:
      - python_dep: celery
      - python_dep: rq
      - python_dep: arq
      - python_dep: dramatiq
      - python_dep: taskiq
      - file_contains: {glob: infra/deploy/render.yaml, regex: 'type:\s*(worker|cron)'}

  - id: auth
    name: Supabase Auth
    type: identity
    technology: JWT (JWKS) · email code + OAuth
    provider: Supabase
    group: supabase
    icon: supabase
    detect:
      - setting: SUPABASE_URL

  - id: postgres
    name: PostgreSQL
    type: database
    technology: "Postgres {supabase_db_major} · SQLAlchemy async + Alembic"
    provider: Supabase
    group: supabase
    icon: postgresql
    detect:
      - python_dep: asyncpg

  - id: storage
    name: Object storage
    type: storage
    technology: Supabase Storage (S3 API) · resumes, assets
    provider: Supabase
    group: supabase
    icon: supabase
    detect:
      - python_dep: boto3

  - id: redis
    name: Redis
    type: cache
    technology: Rate limits · read cache (in-memory fallback)
    group: cache
    icon: redis
    detect:
      - python_dep: redis

  - id: resend
    name: Resend
    type: external
    technology: Transactional email (outbox)
    group: saas
    icon: resend
    detect:
      - setting: RESEND_API_KEY

  - id: sentry
    name: Sentry
    type: external
    technology: Error monitoring (web + API)
    group: saas
    icon: sentry
    detect:
      - python_dep: sentry-sdk
      - node_dep: "@sentry/nextjs"

  - id: stripe
    name: Stripe
    type: external
    technology: Payments
    group: saas
    icon: stripe
    detect:
      - python_dep: stripe
    status: {setting: MARKETPLACE_PAYMENTS_ENABLED, enabled_when: true}

  - id: gha-ci
    name: CI
    type: pipeline
    technology: Lint · tests · E2E · secret scan
    group: github
    icon: githubactions
    detect:
      - file: .github/workflows/ci.yml

  - id: gha-deploy
    name: Deploy
    type: pipeline
    technology: After CI on dev/prod
    group: github
    icon: githubactions
    detect:
      - file_contains: {glob: .github/workflows/*.yml, regex: 'wrangler deploy|api\.render\.com'}

  - id: gha-job-sync
    name: Scheduled job sync
    type: scheduler
    technology: Cron every 6 h
    group: github
    icon: githubactions
    detect:
      - file_contains: {glob: .github/workflows/*.yml, regex: 'jobs/sync/scheduled'}

  - id: gha-monitor
    name: Canary & keep-warm
    type: scheduler
    technology: Health probes
    group: github
    icon: githubactions
    detect:
      - file_contains: {glob: .github/workflows/*.yml, regex: 'health/(ready|live)'}

  - id: infisical
    name: Infisical
    type: secrets
    technology: Secret store · syncs to Render
    group: secrets
    detect:
      - file_contains: {glob: README.md, regex: Infisical}

# Families expanded one component per discovered item.
ai_providers:
  # LiteLLM model prefix -> provider (from AI_FREE_TIER_CHAIN's default).
  groq: {name: Groq}
  gemini: {name: Google Gemini, icon: googlegemini}
  cerebras: {name: Cerebras}
  openrouter: {name: OpenRouter, icon: openrouter}
  mistral: {name: Mistral AI, icon: mistralai}

job_boards:
  # aggregator source_name -> board (from apps/api/app/domains/jobs/aggregators).
  REMOTEOK: {name: RemoteOK}
  ARBEITNOW: {name: Arbeitnow}
  REMOTIVE: {name: Remotive}
  USAJOBS: {name: USAJOBS}
  THEMUSE: {name: The Muse}

connections:
  - {from: users, to: web, label: HTTPS}
  - {from: users, to: auth, label: Sign-in (supabase-js)}
  - {from: web, to: api, label: "REST /api/v1 · Bearer JWT"}
  - {from: api, to: auth, label: JWKS verify · Admin API}
  - {from: api, to: postgres, label: SQL (asyncpg)}
  - {from: api, to: storage, label: S3 API}
  - {from: api, to: redis, label: RESP}
  - {from: api, to: worker, label: Enqueue}
  - {from: api, to: ai-providers, label: LiteLLM}
  - {from: api, to: job-boards, label: HTTPS pull}
  - {from: api, to: resend, label: Email API}
  - {from: api, to: stripe, label: Payments API}
  - {from: api, to: sentry, label: Errors}
  - {from: web, to: sentry, label: Errors}
  - {from: gha-deploy, to: web, label: wrangler deploy}
  - {from: gha-deploy, to: api, label: Render API deploy}
  - {from: gha-job-sync, to: api, label: POST /jobs/sync/scheduled}
  - {from: gha-monitor, to: api, label: /health probes}
  - {from: infisical, to: api, label: Secret sync}

# Evidence that was reviewed and deliberately left off the diagram.
ignore:
  python_deps:
    # Framework, runtime and libraries inside the API process.
    - fastapi
    - starlette
    - uvicorn
    - python-multipart
    - sqlalchemy
    - alembic
    - pydantic
    - pydantic-settings
    - email-validator
    - pyjwt
    - httpx
    - litellm          # drawn as the API -> AI providers edge
    - pypdf
    - python-docx
    - prometheus-fastapi-instrumentator   # /metrics, not scraped by a hosted service
    - structlog
  node_deps:
    - "@supabase/supabase-js"   # drawn as users -> auth
    - "@tanstack/react-query"
    - axios
    - class-variance-authority
    - lucide-react
    - next
    - react
    - react-dom
    - react-hook-form
    - zod
  settings:
    # Matches the external-service pattern but is not a separate component.
    - API_URL                   # this API's own URL
    - DATABASE_URL              # postgres
    - REDIS_URL                 # redis
    - CELERY_BROKER_URL         # legacy alias of REDIS_URL; no Celery dependency
    - SUPABASE_SERVICE_ROLE_KEY # auth (Admin API)
    - AI_API_KEY                # generic LiteLLM override, unset in deploys
    - LITELLM_BASE_URL          # optional LiteLLM proxy, unset in deploys
    - OPENAI_API_KEY            # not in AI_FREE_TIER_CHAIN
    - GROQ_API_KEY
    - GEMINI_API_KEY
    - OPENROUTER_API_KEY
    - CEREBRAS_API_KEY
    - MISTRAL_API_KEY
    - OLLAMA_BASE_URL           # local development model server only
    - REMOTEOK_API_URL          # job boards come from the aggregators
    - ARBEITNOW_API_URL
    - REMOTIVE_API_URL
    - USAJOBS_API_URL
    - USAJOBS_AUTH_KEY
    - THEMUSE_API_URL
    - JOB_SYNC_TOKEN            # gha-job-sync credential
    - STRIPE_SECRET_KEY         # stripe
    - STRIPE_WEBHOOK_SECRET
    - SENTRY_DSN                # sentry
    - APP_URL
    - FRONTEND_URL
