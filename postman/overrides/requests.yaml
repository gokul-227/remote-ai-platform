# Hand-maintained Postman additions, merged into the generated collection by
# `make api-sync` (tools/api_docs/postman.mjs) before it is migrated to v3.
# Everything else under postman/collections/ is regenerated from OpenAPI.
#
# Keys are OpenAPI operations ("METHOD /path" exactly as in docs/api/openapi.yaml).
# An override whose operation disappears fails the sync, so it is never lost silently.
#
#   collection:
#     scripts: [{type: beforeRequest|afterResponse, code: "..."}]
#   requests:
#     "METHOD /path":
#       headers: {Header-Name: "{{variable}}"}
#       query: {name: "{{variable}}"}   # sets and enables a query parameter
#       scripts: [{type: beforeRequest|afterResponse, code: "..."}]   # run after the generated ones
#       guard: destructive   # only runs when allow_destructive is "true"

requests:
  # End the session or delete the account: skipped unless allow_destructive is "true",
  # so a full collection run never signs itself out halfway.
  "POST /api/v1/auth/logout":
    guard: destructive
  "POST /api/v1/auth/logout-all":
    guard: destructive
  "DELETE /api/v1/auth/me":
    guard: destructive

  # The role to switch to comes from {{role}} (environment, or a flow step).
  "PATCH /api/v1/auth/role":
    query: {role: "{{role}}"}

  "GET /health/ready":
    scripts:
      - type: afterResponse
        code: |
          pm.test("API and database are ready", () => {
            pm.response.to.have.status(200);
            pm.expect(pm.response.json().status).to.be.oneOf(["HEALTHY", "DEGRADED"]);
          });

  "GET /api/v1/jobs":
    scripts:
      - type: afterResponse
        code: |
          pm.test("Job list is paginated", () => {
            pm.response.to.have.status(200);
            pm.expect(pm.response.headers.get("X-Total-Count")).to.match(/^\d+$/);
          });
