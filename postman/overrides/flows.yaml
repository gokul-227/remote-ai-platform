# Postman Flows, generated into postman/flows/ by `make api-sync`. Each flow
# runs its steps in order; ids and tokens pass between them through the
# environment, exactly as in a collection run. Steps are OpenAPI operations
# ("METHOD /path") or hand-written requests ("Sign in/Verify code").
# `variables` sets request variables on one step (e.g. the role to switch to).
#
# Flows reference requests by their path in this repository, so they work in
# every clone (Postman 12+, Local View). Default environment: local.

flows:
  - name: Platform health check
    description: Is the API up, ready and ingesting jobs? Safe on every environment.
    steps:
      - GET /health/live
      - GET /health/ready
      - GET /health/version
      - GET /health/ingestion
      - GET /api/v1/jobs

  - name: Professional - find a job and apply
    description: Sign in, check the profile, get AI recommendations, pick a job, apply and see the application.
    steps:
      - Sign in/Send sign-in code
      - Sign in/Verify code
      - Sign in/Who am I
      - GET /api/v1/engineers/me
      - GET /api/v1/matching/recommendations
      - GET /api/v1/jobs
      - GET /api/v1/jobs/{job_id}
      - POST /api/v1/applications/jobs/{job_id}
      - GET /api/v1/applications/me

  - name: Organisation - post a job and review applicants
    description: Sign in, become an organisation, post a job, see AI-ranked candidates and the applications received.
    steps:
      - Sign in/Send sign-in code
      - Sign in/Verify code
      - step: PATCH /api/v1/auth/role
        variables: {role: COMPANY}
      - GET /api/v1/companies/me
      - POST /api/v1/jobs
      - GET /api/v1/jobs/company
      - GET /api/v1/matching/candidates/{job_id}
      - GET /api/v1/applications/company
