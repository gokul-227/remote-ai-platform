  | `end_date` | string (date-time) \\| null | no |  |
  | `milestones` | ContractMilestoneCreate[] | no |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 201 | Successful Response | ContractResponse |
  | 422 | Validation Error | HTTPValidationError |

  **Sets for later requests**

  - `{{contract_id}}`

