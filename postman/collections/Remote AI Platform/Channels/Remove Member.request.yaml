description: |-
  `DELETE /api/v1/channels/{channel_id}/members/{user_id}`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Path variables**

  | Variable | Type | Set by | Description |
  | --- | --- | --- | --- |
  | `{{channel_id}}` | string (uuid) | "Channels › Create Channel" or "Channels › My Channels" |  |
  | `{{user_id}}` | string (uuid) | "Admin Operations › List All Users" or "Trust & Reputation › Submit project review" or "Trust & Reputation › Add verification badge" or "Trust & Reputation › Admin verification queue" or "groups › List Members" |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | object |
  | 422 | Validation Error | HTTPValidationError |

  **Depends on**

  - `{{channel_id}}` — "Channels › Create Channel" or "Channels › My Channels"
  - `{{user_id}}` — "Admin Operations › List All Users" or "Trust & Reputation › Submit project review" or "Trust & Reputation › Add verification badge" or "Trust & Reputation › Admin verification queue" or "groups › List Members"

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

