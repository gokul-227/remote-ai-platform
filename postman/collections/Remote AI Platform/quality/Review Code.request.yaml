        const schema = {"$ref":"#/definitions/CodeReviewReport","definitions":{"CodeReviewReport":{"properties":{"overall_score":{"type":"integer"},"grade":{"type":"string"},"verdict":{"type":"string"},"summary":{"type":"string"},"line_comments":{"items":{"additionalProperties":true,"type":"object"},"type":"array"},"security_flags":{"items":{"type":"string"},"type":"array"},"complexity_analysis":{"additionalProperties":true,"type":"object"},"suggestions":{"items":{"type":"string"},"type":"array"},"requires_revision":{"type":"boolean"}},"type":"object","required":["overall_score","grade","verdict","summary","line_comments","security_flags","complexity_analysis","suggestions","requires_revision"]}}};
        pm.test("Body matches the OpenAPI response schema", () => pm.response.to.have.jsonSchema(schema));
