id: e54034b5-4b0c-5ab1-87b1-765f4113fefc
description: |-
  AI-powered technical code review.

  Analyzes a code snippet or diff and returns line-level comments,
  security flags, complexity analysis, and improvement suggestions.

  `POST /api/v1/quality/review-code`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Request body (application/json, CodeReviewRequest)**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `task_description` | string | yes |  |
  | `code_snippet` | string | yes |  |
  | `language` | string | no |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | CodeReviewReport |
  | 422 | Validation Error | HTTPValidationError |

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
url: "{{base_url}}/api/v1/quality/review-code"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "task_description": "string",
      "code_snippet": "string",
      "language": "python"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
