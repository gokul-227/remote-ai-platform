$kind: http-request
id: d5c4e648-0af3-5e60-a491-be6229aa48cc
description: |-
  AI-powered evaluation of a work submission.

  Analyzes the submission against the task description and acceptance criteria,
  returning a quality report with score, grade, verdict, issues, and recommendations.

  `POST /api/v1/quality/evaluate`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Request body (application/json, SubmissionEvaluationRequest)**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `task_title` | string | yes |  |
  | `task_description` | string | yes |  |
  | `submission_content` | string | yes |  |
  | `requirements` | string[] \\| null | no |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | SubmissionQualityReport |
  | 422 | Validation Error | HTTPValidationError |

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
url: "{{base_url}}/api/v1/quality/evaluate"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "task_title": "string",
      "task_description": "string",
      "submission_content": "string",
      "requirements": [
        "string",
        "string"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Generated from OpenAPI (POST /api/v1/quality/evaluate) -- edit the API or postman/overrides/, not this script.
      if (pm.environment.get("allow_writes") !== "true") {
        console.log("Skipped: this environment is read-only (allow_writes is not \"true\").");
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // Generated from OpenAPI (POST /api/v1/quality/evaluate) -- edit the API or postman/overrides/, not this script.
      const maxMs = Number(pm.variables.get("max_response_ms") || 5000);
      // A 503 that explains itself is deliberate (AI not configured, payments switched off).
      const explained = (() => { try { const b = pm.response.json(); return Boolean(b.error ?? b.detail); } catch (e) { return false; } })();
      pm.test("No server error (5xx), except an explained 503", () => {
        pm.expect(pm.response.code < 500 || (pm.response.code === 503 && explained), `status ${pm.response.code}`).to.be.true;
      });
      pm.test(`Responds within ${maxMs} ms`, () => pm.expect(pm.response.responseTime).to.be.below(maxMs));
      if (pm.response.code >= 200 && pm.response.code < 300) {
        pm.test("Status is the documented success code (200)", () => {
          pm.expect([200]).to.include(pm.response.code);
        });
        pm.test("Responds with JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/json/));
        const schema = {"$ref":"#/definitions/SubmissionQualityReport","definitions":{"QualityIssue":{"properties":{"severity":{"type":"string"},"category":{"type":"string"},"description":{"type":"string"}},"type":"object","required":["severity","category","description"]},"SubmissionQualityReport":{"properties":{"overall_score":{"type":"integer"},"grade":{"type":"string"},"verdict":{"type":"string"},"summary":{"type":"string"},"dimensions":{"additionalProperties":true,"type":"object"},"issues":{"items":{"$ref":"#/definitions/QualityIssue"},"type":"array"},"strengths":{"items":{"type":"string"},"type":"array"},"recommended_actions":{"items":{"type":"string"},"type":"array"},"requires_revision":{"type":"boolean"},"revision_notes":{"anyOf":[{"type":"string"},{"type":"null"}]}},"type":"object","required":["overall_score","grade","verdict","summary","dimensions","issues","strengths","recommended_actions","requires_revision","revision_notes"]}}};
        pm.test("Body matches the OpenAPI response schema", () => pm.response.to.have.jsonSchema(schema));
      } else {
        pm.test("Error response explains the failure (error or detail)", () => {
          const body = pm.response.json();
          pm.expect(body.error ?? body.detail, "error/detail").to.exist;
        });
      }
    language: text/javascript
