$kind: http-request
id: 825a6303-0622-5309-982c-031f9d0fe091
description: Calls the API with your token; the first call creates your account.
url: '{{base_url}}/api/v1/auth/me'
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: '{{access_token}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("API accepts the token", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().email).to.eql(pm.environment.get("email").toLowerCase());
      });
    language: text/javascript
order: 4000
