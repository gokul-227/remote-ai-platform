$kind: http-request
id: 742ed6e9-0ed5-5aec-b9aa-b5336fe89df4
description: Emails a one-time sign-in code to `email` (creates the account on first use).
url: '{{supabase_url}}/auth/v1/otp'
method: POST
headers:
  apikey: '{{supabase_publishable_key}}'
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "create_user": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Sign-in code sent", () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
