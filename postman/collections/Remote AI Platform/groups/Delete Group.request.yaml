scripts:
  - type: beforeRequest
    code: |-
      // Generated from OpenAPI (DELETE /api/v1/groups/{group_id}) -- edit the API or postman/overrides/, not this script.
      if (pm.environment.get("allow_writes") !== "true") {
        console.log("Skipped: this environment is read-only (allow_writes is not \"true\").");
        pm.execution.skipRequest();
      }
      if (!pm.variables.get("group_id")) {
