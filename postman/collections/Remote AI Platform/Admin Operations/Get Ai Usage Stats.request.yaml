$kind: http-request
id: 4d72d7b5-6e18-5a32-8671-e93abc5bdc1d
description: |-
  Get aggregated AI LLM usage metrics, token counts, model distribution, and cost estimates (Admin only).

  Reads `app.services.ai.models.AIUsageLog` -- the row `AIService._record_usage` writes for
  every completion attempt made through `LLMClient` -- rather than `ActivityLog`. The
  ActivityLog-based version of this endpoint queried `details["prompt_tokens"]` on
  "AI_%"-prefixed activity rows, but nothing ever wrote that field onto those rows, so it
  always reported ~0 tokens/cost, and its `model_breakdown`/`feature_breakdown` were
  hardcoded literals (`{"qwen2.5": total_calls}`, `{"resume_parser": ..., "project_planner": 2}`)
  unrelated to any actual call -- a dashboard number that looked real but wasn't.

  `GET /api/v1/admin/ai-usage`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | AIUsageStatsResponse |

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)
url: "{{base_url}}/api/v1/admin/ai-usage"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: // Generated from OpenAPI (GET /api/v1/admin/ai-usage) -- edit the API or postman/overrides/, not this script.
    language: text/javascript
  - type: afterResponse
    code: |-
