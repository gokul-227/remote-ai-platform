  | --- | --- | --- | --- |
  | `is_active` | boolean | yes |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | any |
  | 422 | Validation Error | HTTPValidationError |

  **Depends on**

  - `{{job_id}}` — "Job Posts › Create Job" or "Job Posts › List Jobs"

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
