$kind: http-request
id: 94b09318-6377-54c3-be68-9f8c64554dac
description: |-
  Permanently delete a user and all dependent data (Admin only).

  Every FK to users.id is ON DELETE CASCADE at the database level, so
  this removes the user's profile, applications, notifications, etc.
  along with the row. Irreversible — intended for removing test/demo
  accounts, not for routine account closure (use status suspension for
  that).

  `DELETE /api/v1/admin/users/{user_id}`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Path variables**

  | Variable | Type | Set by | Description |
  | --- | --- | --- | --- |
  | `{{user_id}}` | string (uuid) | "Admin Operations › List All Users" or "Trust & Reputation › Submit project review" or "Trust & Reputation › Add verification badge" or "Trust & Reputation › Admin verification queue" or "groups › List Members" |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 204 | Successful Response |  |
  | 422 | Validation Error | HTTPValidationError |

  **Depends on**

  - `{{user_id}}` — "Admin Operations › List All Users" or "Trust & Reputation › Submit project review" or "Trust & Reputation › Add verification badge" or "Trust & Reputation › Admin verification queue" or "groups › List Members"

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 204
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
  - a variable it depends on is not set yet
url: "{{base_url}}/api/v1/admin/users/:user_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: user_id
    value: "{{user_id}}"
    description: "(Required) "
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Generated from OpenAPI (DELETE /api/v1/admin/users/{user_id}) -- edit the API or postman/overrides/, not this script.
      if (pm.environment.get("allow_writes") !== "true") {
        console.log("Skipped: this environment is read-only (allow_writes is not \"true\").");
        pm.execution.skipRequest();
      }
      if (!pm.variables.get("user_id")) {
        console.log("Skipped: {{user_id}} is not set -- run \"Admin Operations › List All Users\" or \"Trust & Reputation › Submit project review\" or \"Trust & Reputation › Add verification badge\" or \"Trust & Reputation › Admin verification queue\" or \"groups › List Members\" first.");
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // Generated from OpenAPI (DELETE /api/v1/admin/users/{user_id}) -- edit the API or postman/overrides/, not this script.
      const maxMs = Number(pm.variables.get("max_response_ms") || 5000);
      // A 503 that explains itself is deliberate (AI not configured, payments switched off).
      const explained = (() => { try { const b = pm.response.json(); return Boolean(b.error ?? b.detail); } catch (e) { return false; } })();
      pm.test("No server error (5xx), except an explained 503", () => {
        pm.expect(pm.response.code < 500 || (pm.response.code === 503 && explained), `status ${pm.response.code}`).to.be.true;
      });
      pm.test(`Responds within ${maxMs} ms`, () => pm.expect(pm.response.responseTime).to.be.below(maxMs));
      if (pm.response.code >= 200 && pm.response.code < 300) {
        pm.test("Status is the documented success code (204)", () => {
          pm.expect([204]).to.include(pm.response.code);
        });
      } else {
        pm.test("Error response explains the failure (error or detail)", () => {
          const body = pm.response.json();
          pm.expect(body.error ?? body.detail, "error/detail").to.exist;
        });
      }
    language: text/javascript
