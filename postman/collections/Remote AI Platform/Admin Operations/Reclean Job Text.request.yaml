$kind: http-request
id: 44091c50-a12c-5105-a997-e35c0c92aa5f
description: |-
  Re-run HTML-entity/mojibake cleanup over existing job rows (Admin only).

  JobRepository.upsert_external_job always re-cleans title/company_name/
  description on every sync, so this only matters for legacy rows whose
  source listing has since expired from the aggregator's feed and will
  therefore never be re-synced -- a small, permanently-stale tail from
  before clean_text() covered every field it does today.

  `POST /api/v1/admin/jobs/reclean-text`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | object |

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
url: "{{base_url}}/api/v1/admin/jobs/reclean-text"
method: POST
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Generated from OpenAPI (POST /api/v1/admin/jobs/reclean-text) -- edit the API or postman/overrides/, not this script.
      if (pm.environment.get("allow_writes") !== "true") {
        console.log("Skipped: this environment is read-only (allow_writes is not \"true\").");
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      // Generated from OpenAPI (POST /api/v1/admin/jobs/reclean-text) -- edit the API or postman/overrides/, not this script.
      const maxMs = Number(pm.variables.get("max_response_ms") || 5000);
      // A 503 that explains itself is deliberate (AI not configured, payments switched off).
      const explained = (() => { try { const b = pm.response.json(); return Boolean(b.error ?? b.detail); } catch (e) { return false; } })();
      pm.test("No server error (5xx), except an explained 503", () => {
        pm.expect(pm.response.code < 500 || (pm.response.code === 503 && explained), `status ${pm.response.code}`).to.be.true;
      });
      pm.test(`Responds within ${maxMs} ms`, () => pm.expect(pm.response.responseTime).to.be.below(maxMs));
      if (pm.response.code >= 200 && pm.response.code < 300) {
        pm.test("Status is the documented success code (200)", () => {
          pm.expect([200]).to.include(pm.response.code);
        });
        pm.test("Responds with JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/json/));
        const schema = {"additionalProperties":true,"type":"object"};
        pm.test("Body matches the OpenAPI response schema", () => pm.response.to.have.jsonSchema(schema));
      } else {
        pm.test("Error response explains the failure (error or detail)", () => {
          const body = pm.response.json();
          pm.expect(body.error ?? body.detail, "error/detail").to.exist;
        });
      }
    language: text/javascript
examples: ./.resources/Reclean Job Text.resources/examples
order: 2000
