description: |-
  `POST /api/v1/support/tickets`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Request body (application/json, TicketCreate)**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `subject` | string | yes |  |
  | `category` | `ACCOUNT`, `BUG`, `CONTRACT`, `SAFETY`, `OTHER` | yes |  |
  | `body` | string | yes |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 201 | Successful Response | TicketDetail |
  | 422 | Validation Error | HTTPValidationError |

  **Sets for later requests**

  - `{{ticket_id}}`

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 201
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
url: "{{base_url}}/api/v1/support/tickets"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "subject": "string",
      "category": "ACCOUNT",
      "body": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Generated from OpenAPI (POST /api/v1/support/tickets) -- edit the API or postman/overrides/, not this script.
      if (pm.environment.get("allow_writes") !== "true") {
        console.log("Skipped: this environment is read-only (allow_writes is not \"true\").");
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
