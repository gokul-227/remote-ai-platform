description: |-
  Search & filter active remote jobs aggregated from public APIs.

  The total number of matches is returned in the X-Total-Count header.

  `GET /api/v1/jobs`

  **Authorization:** none (public).

  **Query parameters (optional ones are disabled until you enable them)**

  | Name | Type | Required | Default | Description |
  | --- | --- | --- | --- | --- |
  | `query` | string \\\| null | no |  | Keywords search in title or description |
  | `is_remote` | boolean | no | `true` | Filter for remote jobs |
  | `job_type` | string \\\| null | no |  | full-time, contract, part-time |
  | `experience_level` | string \\\| null | no |  | junior, mid, senior, lead |
  | `min_salary` | number \\\| null | no |  |  |
  | `max_salary` | number \\\| null | no |  |  |
  | `salary_currency` | string \\\| null | no |  | ISO currency of min/max_salary (required with them) |
  | `salary_period` | string \\\| null | no |  | Period of min/max_salary (required with them) |
  | `skills` | string[] \\\| null | no |  | Match any of these skills |
  | `source` | string \\\| null | no |  | Filter by source (REMOTEOK, ARBEITNOW, etc.) |
  | `company_id` | string (uuid) \\\| null | no |  | Filter by company profile UUID |
  | `skip` | integer | no | `0` |  |
  | `limit` | integer | no | `20` |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | JobPostResponse[] |
  | 422 | Validation Error | HTTPValidationError |

  **Sets for later requests**

  - `{{job_id}}`

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)
