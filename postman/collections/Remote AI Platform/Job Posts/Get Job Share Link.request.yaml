description: |-
  Public link to a job posting, for sharing.

  `GET /api/v1/jobs/{job_id}/share-link`

  **Authorization:** none (public).

  **Path variables**

  | Variable | Type | Set by | Description |
  | --- | --- | --- | --- |
  | `{{job_id}}` | string (uuid) | "Job Posts › Create Job" or "Job Posts › List Jobs" |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | object |
  | 422 | Validation Error | HTTPValidationError |

  **Depends on**

  - `{{job_id}}` — "Job Posts › Create Job" or "Job Posts › List Jobs"

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - a variable it depends on is not set yet
url: "{{base_url}}/api/v1/jobs/:job_id/share-link"
method: GET
headers:
  Accept: application/json
