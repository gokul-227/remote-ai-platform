description: |-
  Every publicly listed job's id and dates, for the sitemap (SEO-01). The
  job list caps pages at 100 full postings; this returns small rows so the
  sitemap covers the whole public inventory cheaply. Public: the same jobs
  the anonymous list shows.

  `GET /api/v1/jobs/sitemap-entries`

  **Authorization:** none (public).

  **Query parameters (optional ones are disabled until you enable them)**

  | Name | Type | Required | Default | Description |
  | --- | --- | --- | --- | --- |
  | `skip` | integer | no | `0` |  |
  | `limit` | integer | no | `1000` |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | JobSitemapEntry[] |
  | 422 | Validation Error | HTTPValidationError |

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)
