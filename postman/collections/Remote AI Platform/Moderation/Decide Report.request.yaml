  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: report_id
    value: "{{report_id}}"
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "status": "RESOLVED",
      "decision": "HIDE_JOB",
      "note": "string"
    }
