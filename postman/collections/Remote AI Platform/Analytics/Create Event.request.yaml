description: |-
  Ingest a single funnel event.

  `user_id` is never accepted from the client — it is derived solely from
  the bearer token (null for unauthenticated visitors), so a caller cannot
  attribute events to another user's account.

  `POST /api/v1/analytics/events`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Request body (application/json, AnalyticsEventCreate)**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `event_name` | string | yes |  |
  | `properties` | object | no |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 201 | Successful Response | AnalyticsEventResponse |
  | 422 | Validation Error | HTTPValidationError |

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 201
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
url: "{{base_url}}/api/v1/analytics/events"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
