id: 70985bc7-49c2-53bc-875a-a6dffdd557e3
description: |-
  Event counts grouped by event_name and calendar day (Admin only).

  A minimal, first-party substitute for a BI dashboard: enough to see
  where users drop off in the activation funnel without a third-party
  analytics vendor.

  `GET /api/v1/analytics/events/summary`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | AnalyticsSummaryResponse |

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)
url: "{{base_url}}/api/v1/analytics/events/summary"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
