description: |-
  Create a new post. The current user becomes the author.

  `POST /api/v1/social/posts`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Request body (application/json, PostCreate)**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `content` | string | yes |  |
  | `image_url` | string \\\| null | no |  |
  | `link_url` | string \\\| null | no |  |
  | `link_preview_title` | string \\\| null | no |  |
  | `visibility` | string | no |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 201 | Successful Response | PostResponse |
  | 422 | Validation Error | HTTPValidationError |

  **Sets for later requests**

  - `{{post_id}}`

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 201
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
url: "{{base_url}}/api/v1/social/posts"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "content": "string",
      "image_url": "string",
      "link_url": "string",
      "link_preview_title": "string",
      "visibility": "PUBLIC"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
