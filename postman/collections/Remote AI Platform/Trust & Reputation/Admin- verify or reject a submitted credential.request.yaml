name: "Admin: verify or reject a submitted credential"
description: |-
  Move a SELF_REPORTED/PENDING credential to VERIFIED or REJECTED.

  This is the only path that produces a "VERIFIED" badge — it requires
  actual admin review, backed by an audit event, rather than the user's
  own submission.

  `PATCH /api/v1/trust/verifications/{verification_id}/review`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Path variables**

  | Variable | Type | Set by | Description |
  | --- | --- | --- | --- |
  | `{{verification_id}}` | string (uuid) | "Trust & Reputation › Add verification badge" or "Trust & Reputation › Admin verification queue" |  |

  **Request body (application/json, VerificationReviewUpdate)**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `status` | string | yes |  |
  | `verifier_notes` | string \\\| null | no |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | VerificationResponse |
  | 422 | Validation Error | HTTPValidationError |

  **Depends on**

  - `{{verification_id}}` — "Trust & Reputation › Add verification badge" or "Trust & Reputation › Admin verification queue"

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
  - a variable it depends on is not set yet
url: "{{base_url}}/api/v1/trust/verifications/:verification_id/review"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: verification_id
    value: "{{verification_id}}"
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "status": "VERIFIED",
      "verifier_notes": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
