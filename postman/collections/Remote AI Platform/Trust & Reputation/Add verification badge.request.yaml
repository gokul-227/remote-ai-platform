$kind: http-request
id: 00e26f69-a746-587e-86b6-dab72fd36b52
description: |-
  Submit a credential for verification.

  This only records the user's own claim — no evidence is checked here, so
  the badge starts as SELF_REPORTED. It becomes VERIFIED only once an admin
  reviews it via PATCH /verifications/{id}/review; see that endpoint and
  TrustService.calculate_trust_score, which only awards verification points
  for status == "VERIFIED".

  `POST /api/v1/trust/verifications`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Request body (application/json, VerificationCreate)**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `verification_type` | string | yes |  |
  | `verifier_notes` | string \\| null | no |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 201 | Successful Response | VerificationResponse |
  | 422 | Validation Error | HTTPValidationError |

  **Sets for later requests**

  - `{{user_id}}`
  - `{{verification_id}}`

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 201
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
url: "{{base_url}}/api/v1/trust/verifications"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "verification_type": "IDENTITY",
      "verifier_notes": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
