id: 7cb452ee-5a11-5553-82b7-5e30554381cc
description: |-
  Submit a peer review for a completed project or engagement.

  Reviews feed directly into TrustService.calculate_trust_score, so this endpoint
  must only accept reviews from someone who actually participated in the project,
  about someone who was actually on the other side of it — otherwise any
  authenticated user could inflate or deflate an arbitrary user's trust score.
  These checks mirror POST /projects/{project_id}/reviews.

  `POST /api/v1/trust/reviews`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Request body (application/json, ReviewCreate)**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `project_id` | string (uuid) | yes |  |
  | `reviewee_id` | string (uuid) | yes |  |
  | `rating` | integer | yes |  |
  | `comment` | string | yes |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 201 | Successful Response | ProjectReviewResponse |
  | 422 | Validation Error | HTTPValidationError |

  **Sets for later requests**

  - `{{user_id}}`

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 201
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - the environment is read-only (`allow_writes` is not `true`)
url: "{{base_url}}/api/v1/trust/reviews"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
