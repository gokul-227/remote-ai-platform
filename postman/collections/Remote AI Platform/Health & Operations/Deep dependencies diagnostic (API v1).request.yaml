$kind: http-request
id: c3ae0303-8361-5fc0-a4ff-c6c8c3b52717
description: |-
  Deep dependency inspection checking DB, Redis, S3 Storage, and AI provider.

  Administrators only: every call probes each backing service and names the
  configured providers. Load balancers use /health/ready.

  `GET /api/v1/health/dependencies`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | HealthReadyResponse |

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)
url: "{{base_url}}/api/v1/health/dependencies"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: // Generated from OpenAPI (GET /api/v1/health/dependencies) -- edit the API or postman/overrides/, not this script.
    language: text/javascript
  - type: afterResponse
    code: |-
      // Generated from OpenAPI (GET /api/v1/health/dependencies) -- edit the API or postman/overrides/, not this script.
      const maxMs = Number(pm.variables.get("max_response_ms") || 5000);
      // A 503 that explains itself is deliberate (AI not configured, payments switched off).
      const explained = (() => { try { const b = pm.response.json(); return Boolean(b.error ?? b.detail); } catch (e) { return false; } })();
      pm.test("No server error (5xx), except an explained 503", () => {
        pm.expect(pm.response.code < 500 || (pm.response.code === 503 && explained), `status ${pm.response.code}`).to.be.true;
      });
      pm.test(`Responds within ${maxMs} ms`, () => pm.expect(pm.response.responseTime).to.be.below(maxMs));
      if (pm.response.code >= 200 && pm.response.code < 300) {
        pm.test("Status is the documented success code (200)", () => {
          pm.expect([200]).to.include(pm.response.code);
        });
        pm.test("Responds with JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.match(/application\/json/));
        const schema = {"$ref":"#/definitions/HealthReadyResponse","definitions":{"HealthReadyResponse":{"properties":{"status":{"type":"string"},"version":{"type":"string"},"environment":{"type":"string"},"timestamp":{"type":"string"},"services":{"additionalProperties":{"$ref":"#/definitions/ServiceCheckResult"},"type":"object"}},"type":"object","required":["status","version","environment","timestamp","services"]},"ServiceCheckResult":{"properties":{"service":{"type":"string"},"status":{"type":"string"},"latency_ms":{"type":"number"},"checked_at":{"type":"string"},"details":{"anyOf":[{"additionalProperties":true,"type":"object"},{"type":"null"}]},"error":{"anyOf":[{"type":"string"},{"type":"null"}]}},"type":"object","required":["service","status","latency_ms","checked_at"]}}};
        pm.test("Body matches the OpenAPI response schema", () => pm.response.to.have.jsonSchema(schema));
      } else {
        pm.test("Error response explains the failure (error or detail)", () => {
          const body = pm.response.json();
          pm.expect(body.error ?? body.detail, "error/detail").to.exist;
        });
      }
    language: text/javascript
