description: |-
  Get public engineer profile by ID.

  The profile itself is visible to anonymous callers (public directory
  browsing), but resume_url/parsed_resume_data are private -- only the
  profile owner or an admin may see them, matching EngineerPublicProfileResponse's
  use everywhere else (list/search). Any other caller, authenticated or not,
  must never be able to harvest another engineer's resume data this way.

  `GET /api/v1/engineers/{profile_id}`

  **Authorization:** Bearer `{{access_token}}` (Supabase session). Run *Sign in* first, or let the collection sign in for you where `auto_sign_in` is on.

  **Path variables**

  | Variable | Type | Set by | Description |
  | --- | --- | --- | --- |
  | `{{profile_id}}` | string (uuid) | "Engineer Profiles › List Engineers" |  |

  **Responses**

  | Status | Meaning | Body |
  | --- | --- | --- |
  | 200 | Successful Response | EngineerProfileResponse \\| EngineerPublicProfileResponse |
  | 422 | Validation Error | HTTPValidationError |

  **Depends on**

  - `{{profile_id}}` — "Engineer Profiles › List Engineers"

  **Tests**

  - No server error (5xx), except a 503 that explains itself (AI or payments switched off)
  - Responds within `max_response_ms`
  - On success: status is 200
  - On success: JSON body matches the OpenAPI response schema
  - On failure: the error body says why (`error` or `detail`)

  **Skipped when**

  - a variable it depends on is not set yet
url: "{{base_url}}/api/v1/engineers/:profile_id"
