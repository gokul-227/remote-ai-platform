        app.core.feature_flags) -- there is no runtime toggle endpoint yet. Lets
        an admin confirm what's actually enabled without redeploying or reading
        server env vars directly.
      operationId: get_feature_flags_api_v1_admin_feature_flags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagsResponse'
      security:
      - HTTPBearer: []
  /api/v1/admin/ai-usage:
    get:
      tags:
      - Admin Operations
      summary: Get Ai Usage Stats
      description: |-
        Get aggregated AI LLM usage metrics, token counts, model distribution, and cost estimates (Admin only).

        Reads `app.services.ai.models.AIUsageLog` -- the row `AIService._record_usage` writes for
        every completion attempt made through `LLMClient` -- rather than `ActivityLog`. The
        ActivityLog-based version of this endpoint queried `details["prompt_tokens"]` on
        "AI_%"-prefixed activity rows, but nothing ever wrote that field onto those rows, so it
        always reported ~0 tokens/cost, and its `model_breakdown`/`feature_breakdown` were
        hardcoded literals (`{"qwen2.5": total_calls}`, `{"resume_parser": ..., "project_planner": 2}`)
        unrelated to any actual call -- a dashboard number that looked real but wasn't.
      operationId: get_ai_usage_stats_api_v1_admin_ai_usage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIUsageStatsResponse'
      security:
      - HTTPBearer: []
  /api/v1/admin/health/details:
    get:
      tags:
      - Admin Operations
      summary: Get System Health Details
      description: |-
        Detailed health check for all core platform subsystems (Postgres, Redis, object storage, Supabase Auth).

        Each subsystem is checked directly (a real Postgres query, a real Redis PING,
        a real S3 list-buckets call, a real Supabase Auth health call) rather than reported
        as a static value — a prior version of this endpoint hardcoded every non-Postgres
        row to "OPERATIONAL", which meant it could never reflect a real outage.
      operationId: get_system_health_details_api_v1_admin_health_details_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthDetailResponse'
      security:
      - HTTPBearer: []
