      operationId: list_verification_queue_api_v1_trust_verifications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(SELF_REPORTED|VERIFIED|REJECTED)$
          - type: 'null'
          default: SELF_REPORTED
